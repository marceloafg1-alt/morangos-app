/* =====================================================================
   LivTask · aparência reutilizável (base)
   Só visual: cores, tipografia, espaçamentos, raios, sombras e modos.
   Ligue no elemento raiz do app (ou em qualquer bloco):
     <body class="lt" data-tema="verde" data-visual="classico"
           data-escuro="0" data-solido="0">
   Visuais: classico | aurora | bento
   Ordem de carga: livtask-temas.css → livtask-base.css → livtask-componentes.css
   ===================================================================== */



/* ---------- 1. Cores neutras e de estado (valem para todos os temas) ---------- */
.lt{
  --ground:#F6F5F2; --card:#FFFFFF; --line:#E7E5DF; --fill:#FFFFFF;
  --ink:#17181B; --muted:#6B6F76; --muted2:#9A9DA3; --dot:#C9C7C0;
  --badge:#B4541A; --btn:#FFFFFF; --onA:#FFFFFF; --onG:var(--ink);
  /* estados (pílulas de status: Enviado, Em conferência, Conferido, Devolvido, Disponível) */
  --warn:#9A5B00; --warnBg:#FBEFD9;
  --info:#2D5BA8; --infoBg:#E3ECFA;
  --okc:#1E7A52;  --okBg:#DDF1E6;
  --bad:#B42318;  --badBg:#FDE4E2;
  --late:#C9302C; --lateBg:rgba(229,72,77,.12);

  /* ---------- 2. Tipografia ---------- */
  --ff:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;   /* texto */
  --fh:var(--ff);                                                  /* títulos */
  --fs-xs:11px; --fs-sm:12.5px; --fs:14px; --fs-md:15px; --fs-lg:18px; --fs-xl:20px; --fs-2xl:26px;
  --fw-title:700; --fw-row:600; --ls-title:-.02em;

  /* ---------- 3. Espaçamentos ---------- */
  --sp-page:20px;      /* margem lateral da tela */
  --sp-gap:20px;       /* espaço entre blocos da tela */
  --sp-grid:12px;      /* espaço entre cartões de uma grade */
  --sp-card-x:16px;    /* respiro interno dos cartões */
  --sp-row-y:12px;     /* altura das linhas de lista */

  /* ---------- 4. Forma (raios, contornos, sombras) ---------- */
  --r-card:18px;  --r-tile:18px; --r-hero:20px; --r-ctl:14px; --r-btn:25px;
  --r-chip:16px;  --r-ico:12px;  --r-back:19px;
  --bd:1px solid var(--line);          /* contorno de cartões */
  --sh1:none; --sh2:0 10px 24px rgba(0,0,0,.08);
  --ico:36px;                          /* ícone das linhas e cartões */

  /* fundo da tela: degradê suave do tema (g1 → g2 → ground) */
  --page-bg:linear-gradient(180deg,var(--g1) 0%,var(--g2) 30%,var(--ground) 60%) 0 0/100% 100vh no-repeat var(--ground);
  --on-page:var(--ink); --on-page-muted:var(--muted); --on-page-link:var(--accent);

  font-family:var(--ff); font-size:var(--fs); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.lt :is(button,input,textarea,select){font-family:inherit}
.lt :is(h1,h2,h3){font-family:var(--fh)}

/* ---------- Cor sólida (no lugar do degradê), modo claro ---------- */
.lt[data-solido="1"]:not([data-escuro="1"]):not([data-visual="aurora"]):not([data-visual="bento"]){
  --ground:var(--solid);
  --page-bg:var(--ground);
  --on-page:var(--onG); --on-page-muted:color-mix(in srgb,var(--onG) 72%,transparent);
  --on-page-link:var(--onG);
}

/* ---------- Modo escuro (Clássico; Bento tem o seu abaixo) ---------- */
.lt[data-escuro="1"]{
  --ground:#121416; --card:#1C1F22; --fill:#1C1F22; --line:#454B52;
  --ink:#EEF0F2; --muted:#B0B6BD; --muted2:#9097A0; --dot:#43484E;
  --g1:color-mix(in srgb,var(--a2) 38%,#121416);
  --g2:color-mix(in srgb,var(--a2) 14%,#121416);
  --tint:color-mix(in srgb,var(--a1) 32%,#1C1F22);
  --accent:color-mix(in srgb,var(--a1) 78%,#fff);
  --glow:rgba(0,0,0,.45);
  --warn:#F2C26B; --warnBg:#3A2E17; --info:#8DB3F5; --infoBg:#1D2A40;
  --okc:#7FD9A9;  --okBg:#173327;   --bad:#FF9C94; --badBg:#3D1D1B;
  --late:#FF8A85; --lateBg:rgba(229,72,77,.2);
  color-scheme:dark;
}

/* =====================================================================
   VISUAL AURORA · cartões brancos flutuando sobre fundo escuro do tema,
   sombras suaves, cantos 22px, fonte Plus Jakarta Sans.
   No app, Aurora só existe no claro e em degradê: escuro/sólido são ignorados.
   ===================================================================== */
.lt[data-visual="aurora"]{
  --ff:'Plus Jakarta Sans','Manrope',system-ui,sans-serif; --fh:var(--ff);
  /* volta às cores claras mesmo se data-escuro/data-solido vierem ligados */
  --ground:#F1F3F7; --card:#FFFFFF; --line:#E5E8EE; --fill:#F3F5F8;
  --ink:#0F172A; --muted:#64748B; --muted2:#94A3B8;
  --r-card:22px; --r-tile:22px; --r-hero:26px; --r-btn:15px; --r-chip:999px; --r-ico:14px; --r-back:14px;
  --bd:0; --ico:42px; --sp-card-x:22px; --sp-row-y:15px; --fw-row:700;
  --sh1:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --sh2:0 2px 6px rgba(15,23,42,.07),0 18px 40px rgba(15,23,42,.12);
  /* fundo: cor do tema escurecida até quase preto */
  --page-bg:linear-gradient(180deg,
      color-mix(in srgb,var(--a2) 80%,#0B1016) 0%,
      color-mix(in srgb,var(--a2) 50%,#0B1016) 13%,
      color-mix(in srgb,var(--a2) 20%,#0B1016) 30%,
      #0B1016 100%) fixed #0B1016;
  --on-page:#FFFFFF; --on-page-muted:rgba(255,255,255,.78);
  --on-page-link:color-mix(in srgb,var(--a1) 45%,#fff);
  --warn:#9A5B00; --warnBg:#FBEFD9; --info:#2D5BA8; --infoBg:#E3ECFA;
  --okc:#1E7A52; --okBg:#DDF1E6; --bad:#B42318; --badBg:#FDE4E2;
  --late:#C9302C; --lateBg:rgba(229,72,77,.12);
  color-scheme:light;
}
/* Aurora usa as cores claras do tema (accent/tint), mesmo se escuro estiver ligado */
.lt[data-visual="aurora"][data-escuro="1"]{--accent:var(--a2);--tint:color-mix(in srgb,var(--a1) 16%,#fff);--g1:#fff;--g2:#fff}

/* =====================================================================
   VISUAL BENTO · mosaico de blocos coloridos, cantos 28px, sem sombras,
   pílulas, doca escura no rodapé, Bricolage Grotesque + Figtree.
   O Bento NÃO usa a cor do tema: tem paleta própria (preto + lima + pastéis).
   ===================================================================== */
.lt[data-visual="bento"]{
  --fh:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --ff:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --lime:#D6F35C; --lilac:#CDBFFF; --peach:#FFC59E; --sky:#AFD8FF; --mint:#B4EBCB; --butter:#FFE27A; --rose:#FFB8C9;
  --onT:#141416; --onT2:rgba(20,20,22,.62); --jet:#141416; --jet2:#26262B;
  --ground:#EEECE6; --card:#FFFFFF; --line:#E2DFD6; --fill:#F5F3EE;
  --ink:#141416; --muted:#6A675F; --muted2:#A3A097;
  --g1:#EEECE6; --g2:#EEECE6;
  --accent:#141416; --a1:#141416; --a2:#26262B; --a3:#141416; --onA:#fff; --tint:#ECEAE3;
  --r-card:28px; --r-tile:22px; --r-hero:26px; --r-btn:999px; --r-chip:999px; --r-ico:50%; --r-back:50%;
  --bd:0; --sh1:none; --sh2:none; --glow:transparent; --ico:38px; --sp-grid:12px;
  --fw-title:800; --fw-row:700; --ls-title:-.03em;
  --page-bg:var(--ground); --on-page:var(--ink); --on-page-muted:var(--muted); --on-page-link:var(--ink);
}
.lt[data-visual="bento"][data-escuro="1"]{
  --ground:#0C0C0E; --card:#1A1A1E; --line:#45454D; --fill:#222227;
  --ink:#F4F3EF; --muted:#B7B5AF; --muted2:#96948E; --g1:#0C0C0E; --g2:#0C0C0E;
  --lime:#C9E655; --lilac:#B9A9F5; --peach:#F4B48A; --sky:#9CC9F2; --mint:#9FDDB9; --butter:#F1D366; --rose:#F2A6B9;
  --jet:#C9E655; --jet2:#B5D146;
  --accent:#C9E655; --a1:#C9E655; --a2:#B5D146; --a3:#C9E655; --onA:#141416; --tint:#26262B;
}

/* =====================================================================
   LivTask · componentes visuais (só aparência, sem comportamento)
   Todas as classes começam com "lt-" para não colidir com o app de destino.
   Dependem das variáveis de livtask-temas.css + livtask-base.css.
   ===================================================================== */

/* ---------- Tela ---------- */
.lt-page{min-height:100vh;min-height:100dvh;background:var(--page-bg);color:var(--ink);
  padding:12px var(--sp-page) 110px;display:flex;flex-direction:column;gap:var(--sp-gap);box-sizing:border-box}
.lt-page>*{flex-shrink:0}
.lt *,.lt *::before,.lt *::after{box-sizing:border-box}
.lt button{cursor:pointer}

/* ---------- Topo da tela inicial ---------- */
.lt-top{display:flex;flex-direction:column;gap:2px;color:var(--on-page)}
.lt-company{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;border:0;background:none;
  padding:3px 8px 3px 3px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--on-page-muted)}
.lt-company svg{width:16px;height:16px}
.lt-badge-emp{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a3))}
.lt-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lt-title{margin:0;font-family:var(--fh);font-size:var(--fs-2xl);font-weight:var(--fw-title);letter-spacing:var(--ls-title);line-height:1.15;color:var(--on-page)}
.lt-iconbtns{display:flex;gap:6px}
.lt-iconbtn{position:relative;width:36px;height:36px;border:0;border-radius:18px;background:none;color:var(--on-page);
  display:inline-flex;align-items:center;justify-content:center}
.lt-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--badge);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center}

/* ---------- Cabeçalho das telas internas (voltar + título) ---------- */
.lt-head{display:flex;align-items:center;gap:12px;color:var(--on-page)}
.lt-back{flex:none;width:38px;height:38px;border-radius:var(--r-back);border:var(--bd);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh1)}
.lt-head .lt-kicker{font-size:12.5px;font-weight:500;color:var(--on-page-muted)}
.lt-head h1{margin:0;font-family:var(--fh);font-size:var(--fs-xl);font-weight:var(--fw-title);letter-spacing:var(--ls-title);color:var(--on-page)}

/* ---------- Títulos de seção ---------- */
.lt-sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.lt-sec h2{margin:0;font-size:var(--fs-md);font-weight:700;color:var(--on-page)}
.lt-link{border:0;background:none;padding:4px 0;font-size:13px;font-weight:600;color:var(--on-page-link)}

/* ---------- Cartão de destaque ("Importante") ---------- */
.lt-hero{border-radius:var(--r-hero);padding:16px;color:#fff;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(135deg,var(--a1) 0%,var(--a2) 55%,var(--a3) 100%);box-shadow:0 10px 24px var(--glow)}
.lt-hero-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.lt-pill-on{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px}
.lt-hero-item{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 10px 0 12px;border:0;border-radius:9px;
  background:rgba(255,255,255,.14);color:inherit;font-size:13.5px;font-weight:600;text-align:left}
.lt-hero-item svg{width:15px;height:15px;flex:none}
.lt-hero-item .lt-grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-hero-item small{font-size:11.5px;font-weight:600;opacity:.9}
.lt-hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;font-size:13px}
.lt-btn-on{height:36px;padding:0 18px;border:0;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:700}

/* ---------- Cartão e linhas de lista ---------- */
.lt-card{background:var(--card);border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh1);padding:2px var(--sp-card-x);overflow:hidden}
.lt-row{display:flex;align-items:center;gap:12px;width:100%;padding:var(--sp-row-y) 0;border:0;border-bottom:1px solid var(--line);
  background:none;color:var(--ink);text-align:left;font:inherit}
.lt-card>.lt-row:last-child{border-bottom:0}
.lt-row.lt-solo{background:var(--card);border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh1);padding:12px var(--sp-card-x)}
.lt-ico{flex:none;width:var(--ico);height:var(--ico);border-radius:var(--r-ico);background:var(--tint);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center}
.lt-ico svg{width:20px;height:20px}
.lt-rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lt-rt b{font-size:var(--fs);font-weight:var(--fw-row)}
.lt-rt small{font-size:12px;color:var(--muted)}
.lt-chev{flex:none;color:var(--muted2);display:inline-flex}
.lt-kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lt-kv:last-child{border-bottom:0}.lt-kv span{color:var(--muted)}.lt-kv b{font-weight:600}

/* ---------- Grade de atalhos (tiles) e pastas ---------- */
.lt-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-grid)}
.lt-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lt-tile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:12px;min-height:104px;padding:16px;
  background:var(--card);border:var(--bd);border-radius:var(--r-tile);box-shadow:var(--sh1);color:var(--ink);text-align:left;font:inherit}
.lt-tile .lt-ico{--ico:36px}
.lt-tile b{font-family:var(--fh);font-size:var(--fs-md);font-weight:600;line-height:1.2}
.lt-folder{min-height:88px;padding:10px 9px 11px;gap:8px;border-radius:calc(var(--r-tile) - 2px)}
.lt-folder .lt-fh{display:flex;align-items:center;gap:8px;width:100%}
.lt-folder .lt-ico{--ico:30px}.lt-folder .lt-ico svg{width:17px;height:17px}
.lt-folder small{font-size:11px;color:var(--muted)}
.lt-folder b{font-size:12.5px;font-weight:700}

/* ---------- Botões ---------- */
.lt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border:0;border-radius:var(--r-btn);
  background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));color:var(--onA);font-size:var(--fs-md);font-weight:700;
  box-shadow:0 8px 18px var(--glow)}
.lt-btn.lt-block{width:100%}
.lt-btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 10px;white-space:nowrap;border:var(--bd);border-radius:14px;
  background:var(--card);color:var(--accent);font-size:13px;font-weight:700;box-shadow:var(--sh1)}
.lt-btn2 svg{width:16px;height:16px}
.lt-btn-sm{height:32px;padding:0 14px;font-size:13px;box-shadow:none}

/* ---------- Pílulas e etiquetas ---------- */
.lt-pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.lt-pill.neutral{background:var(--tint);color:var(--muted)}
.lt-pill.warn{background:var(--warnBg);color:var(--warn)}
.lt-pill.info{background:var(--infoBg);color:var(--info)}
.lt-pill.ok{background:var(--okBg);color:var(--okc)}
.lt-pill.bad{background:var(--badBg);color:var(--bad)}
.lt-late{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--lateBg);color:var(--late);font-size:11.5px;font-weight:700;vertical-align:1px}

/* ---------- Filtros (chips), busca e campos ---------- */
.lt-chips{display:flex;gap:8px;flex-wrap:wrap}
.lt-chip{height:32px;padding:0 14px;border:var(--bd);border-radius:var(--r-chip);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;box-shadow:var(--sh1)}
.lt-chip.on{background:var(--accent);border-color:var(--accent);color:var(--onA)}
.lt-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:var(--bd);border-radius:var(--r-ctl);background:var(--card);color:var(--muted);box-shadow:var(--sh1)}
.lt-search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:14px;font-weight:500}
.lt-field{display:flex;flex-direction:column;gap:6px}
.lt-field label{font-size:13px;font-weight:700;color:var(--on-page)}
.lt-input{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card);color:var(--ink);font-size:var(--fs-md);font-weight:500;outline:0;width:100%}
.lt-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.lt-note{padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--ink);font-size:13px;line-height:1.45}

/* ---------- Etapas de formulário ---------- */
.lt-steps{display:flex;flex-direction:column;gap:6px}
.lt-steps span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lt-steps b{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;color:var(--on-page)}
.lt-bar{display:flex;gap:4px;margin-top:4px}
.lt-bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.lt-bar i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}

/* ---------- Seletor de período (competência) ---------- */
.lt-period{display:flex;gap:8px}
.lt-period button{height:52px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--accent);box-shadow:var(--sh1);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.lt-period .lt-nav{flex:none;width:52px}
.lt-period .lt-cur{flex:1;min-width:0;color:var(--ink);padding:0 12px;white-space:nowrap}
.lt-period .lt-cur span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lt-period .lt-cur b{font-size:15px}

/* ---------- Avatar e chave (switch) ---------- */
.lt-avatar{flex:none;width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onA);font-weight:800;font-size:18px}
.lt-switch{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;margin:0;transition:background .2s}
.lt-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.lt-switch:checked{background:var(--accent)}.lt-switch:checked::after{transform:translateX(18px)}

/* ---------- Vazio ---------- */
.lt-empty{margin:0;padding:18px 0;text-align:center;font-size:13px;color:var(--muted)}
.lt-page>.lt-empty,.lt-page>section>.lt-empty{color:var(--on-page-muted)}

/* ---------- Chat ---------- */
.lt-chattabs{display:flex;align-items:center;padding:3px;border-radius:999px;background:var(--ground);border:1px solid var(--line);max-width:420px}
.lt-chattab{flex:1;height:38px;border:0;border-radius:999px;background:none;color:var(--muted);font-weight:700;font-size:13px}
.lt-chattab.on{background:var(--accent);color:var(--onA);box-shadow:0 4px 12px -4px var(--accent)}
.lt-msgs{display:flex;flex-direction:column;gap:10px}
.lt-msg{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:84%}
.lt-msg.me{align-self:flex-end;align-items:flex-end}
.lt-bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:14px;line-height:1.4}
.lt-msg.me .lt-bubble{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onA);border:0;border-radius:18px 18px 6px 18px}
.lt-msg small{font-size:11.5px;color:var(--on-page-muted)}
.lt-composer{display:flex;align-items:flex-end;gap:8px}
.lt-composer .lt-cin{flex:1;display:flex;align-items:center;gap:2px;min-height:46px;padding:2px 4px;border:1px solid var(--accent);border-radius:22px;background:var(--card);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.lt-composer textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font-size:15px;font-weight:500;padding:10px 4px;height:40px}
.lt-composer .lt-cin button{width:36px;height:36px;border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.lt-send{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:inline-flex;align-items:center;justify-content:center}

/* =====================================================================
   Ajustes do visual AURORA
   ===================================================================== */
.lt[data-visual="aurora"] .lt-sec h2{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--on-page-muted)}
.lt[data-visual="aurora"] .lt-link{font-weight:700}
.lt[data-visual="aurora"] .lt-company{background:rgba(255,255,255,.08);padding:4px 10px 4px 4px;border-radius:12px;color:#fff;font-size:13px}
.lt[data-visual="aurora"] .lt-iconbtn{width:42px;height:42px;border-radius:14px}
.lt[data-visual="aurora"] .lt-back{width:42px;height:42px;background:rgba(255,255,255,.1);color:#fff}
.lt[data-visual="aurora"] .lt-hero{background:linear-gradient(130deg,var(--a1) 0%,var(--a2) 45%,var(--a3) 80%,color-mix(in srgb,var(--a3) 70%,#000) 100%);box-shadow:0 20px 44px color-mix(in srgb,var(--a2) 32%,transparent)}
.lt[data-visual="aurora"] .lt-hero-item{min-height:34px;border-radius:11px}
.lt[data-visual="aurora"] .lt-btn-on{height:40px;border-radius:12px;font-weight:800}
.lt[data-visual="aurora"] .lt-row.lt-solo{padding:18px 22px}
.lt[data-visual="aurora"] .lt-ico{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 18%,var(--card)),color-mix(in srgb,var(--a2) 26%,var(--card)))}
.lt[data-visual="aurora"] .lt-rt b{font-size:14.5px}
.lt[data-visual="aurora"] .lt-rt small{font-size:12.5px}
.lt[data-visual="aurora"] .lt-tile .lt-ico{border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2) 70%,var(--a3));box-shadow:0 6px 14px color-mix(in srgb,var(--a2) 30%,transparent)}
.lt[data-visual="aurora"] .lt-tile b{font-weight:700;letter-spacing:-.01em}
.lt[data-visual="aurora"] .lt-folder .lt-ico{--ico:30px}
.lt[data-visual="aurora"] .lt-btn{border-radius:15px;font-weight:800;box-shadow:0 8px 18px color-mix(in srgb,var(--a2) 30%,transparent)}
.lt[data-visual="aurora"] .lt-chip{height:36px;padding:0 16px;font-weight:700}
.lt[data-visual="aurora"] .lt-chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.lt[data-visual="aurora"] .lt-search{height:50px}
.lt[data-visual="aurora"] .lt-input{height:50px;background:var(--fill);border-color:transparent}
.lt[data-visual="aurora"] .lt-steps span{color:var(--on-page)}
.lt[data-visual="aurora"] .lt-bubble{border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:14.5px}
.lt[data-visual="aurora"] .lt-msg.me .lt-bubble{border-radius:20px 20px 6px 20px;box-shadow:0 8px 20px color-mix(in srgb,var(--a2) 26%,transparent)}

/* =====================================================================
   Ajustes do visual BENTO
   ===================================================================== */
.lt[data-visual="bento"] .lt-page{gap:12px}
.lt[data-visual="bento"] .lt-title{font-weight:800;line-height:1}
.lt[data-visual="bento"] .lt-badge-emp{border-radius:50%;background:#141416;color:#D6F35C}
.lt[data-visual="bento"][data-escuro="1"] .lt-badge-emp{background:var(--lime);color:#141416}
.lt[data-visual="bento"] .lt-company{font-weight:700;color:var(--muted);border-radius:999px}
.lt[data-visual="bento"] .lt-iconbtn{width:42px;height:42px;border-radius:50%}
.lt[data-visual="bento"] .lt-back{background:var(--card);border:0}
.lt[data-visual="bento"] .lt-sec h2{font-family:var(--fh);font-size:16px;letter-spacing:-.02em}
.lt[data-visual="bento"] .lt-link{background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.lt[data-visual="bento"] .lt-hero{background:#141416;color:#fff;box-shadow:none;padding:16px 18px}
.lt[data-visual="bento"] .lt-pill-on{background:var(--lime);color:#141416;border-radius:999px;padding:5px 11px;font-weight:700}
.lt[data-visual="bento"] .lt-hero-item{min-height:34px;border-radius:11px;background:rgba(255,255,255,.09);padding:0 12px}
.lt[data-visual="bento"] .lt-btn-on{height:40px;background:var(--lime);color:#141416;border-radius:999px}
.lt[data-visual="bento"][data-escuro="1"] .lt-hero{background:var(--card);border:1px solid var(--line)}
.lt[data-visual="bento"] .lt-card{padding:2px 16px}
.lt[data-visual="bento"] .lt-row.lt-solo{background:var(--butter);color:var(--onT);border-radius:28px}
.lt[data-visual="bento"] .lt-row.lt-solo small{color:var(--onT)}
.lt[data-visual="bento"] .lt-ico{background:var(--jet);color:var(--card)}
.lt[data-visual="bento"] .lt-row.lt-solo .lt-ico{background:#141416;color:var(--butter)}
.lt[data-visual="bento"] .lt-row.lt-solo .lt-late{background:rgba(20,20,22,.12);color:#141416}
.lt[data-visual="bento"] .lt-tile{color:var(--onT);padding:14px;gap:10px;min-height:108px;justify-content:space-between}
.lt[data-visual="bento"] .lt-tile b{font-weight:700;letter-spacing:-.02em}
.lt[data-visual="bento"] .lt-tile small{color:var(--onT2)}
.lt[data-visual="bento"] .lt-tile .lt-ico{--ico:38px;background:#141416;color:var(--tc,var(--lime))}
/* cores dos blocos: em ordem, ou escolha com lt-c-lime, lt-c-lilac, ... */
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+1){--tc:var(--lime);background:var(--lime)}
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+2){--tc:var(--lilac);background:var(--lilac)}
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+3){--tc:var(--peach);background:var(--peach)}
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+4){--tc:var(--sky);background:var(--sky)}
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+5){--tc:var(--mint);background:var(--mint)}
.lt[data-visual="bento"] :is(.lt-grid2,.lt-grid3)>.lt-tile:nth-child(6n+6){--tc:var(--butter);background:var(--butter)}
.lt[data-visual="bento"] .lt-tile.lt-c-lime{--tc:var(--lime);background:var(--lime)}
.lt[data-visual="bento"] .lt-tile.lt-c-lilac{--tc:var(--lilac);background:var(--lilac)}
.lt[data-visual="bento"] .lt-tile.lt-c-peach{--tc:var(--peach);background:var(--peach)}
.lt[data-visual="bento"] .lt-tile.lt-c-sky{--tc:var(--sky);background:var(--sky)}
.lt[data-visual="bento"] .lt-tile.lt-c-mint{--tc:var(--mint);background:var(--mint)}
.lt[data-visual="bento"] .lt-tile.lt-c-butter{--tc:var(--butter);background:var(--butter)}
.lt[data-visual="bento"] .lt-tile.lt-c-rose{--tc:var(--rose);background:var(--rose)}
.lt[data-visual="bento"] .lt-folder{min-height:114px;padding:12px}
.lt[data-visual="bento"] .lt-folder .lt-ico{--ico:30px}
.lt[data-visual="bento"] .lt-btn{background:var(--jet);color:var(--ground);box-shadow:none}
.lt[data-visual="bento"][data-escuro="1"] .lt-btn{color:#141416}
.lt[data-visual="bento"] .lt-btn2{border:0;border-radius:999px;color:var(--ink)}
.lt[data-visual="bento"] .lt-chip{border:0;color:var(--ink)}
.lt[data-visual="bento"] .lt-chip.on{background:var(--jet);color:var(--ground)}
.lt[data-visual="bento"][data-escuro="1"] .lt-chip.on{color:#141416}
.lt[data-visual="bento"] .lt-search{border:0;border-radius:999px}
.lt[data-visual="bento"] .lt-input{border-color:transparent}
.lt[data-visual="bento"] .lt-note{background:var(--tint)}
.lt[data-visual="bento"] .lt-steps span{color:var(--ink)}
.lt[data-visual="bento"] .lt-bar i.on{background:var(--jet)}
.lt[data-visual="bento"] .lt-period button{color:var(--ink);border-color:var(--line)}
.lt[data-visual="bento"] .lt-avatar{background:var(--lilac);color:#141416}
.lt[data-visual="bento"] .lt-chattab.on{background:var(--jet);color:var(--ground)}
.lt[data-visual="bento"] .lt-msg.me .lt-bubble{background:var(--jet);color:var(--ground);border-radius:22px 22px 6px 22px}
.lt[data-visual="bento"] .lt-bubble{border-radius:22px 22px 22px 6px}
.lt[data-visual="bento"] .lt-composer .lt-cin{border-color:var(--jet);box-shadow:0 0 0 3px color-mix(in srgb,var(--jet) 14%,transparent)}
.lt[data-visual="bento"] .lt-send{background:var(--jet);color:var(--ground)}


/* =====================================================================
   Menu inferior
   Padrão: doca flutuante do celular (botão + à esquerda, item ativo em pílula com nome).
   Variante .lt-plana: barra de largura total com o + no centro (versão para tela larga).
   ===================================================================== */
.lt-tabbar{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;align-items:center;gap:4px;padding:8px 6px 7px;border-radius:24px;background:var(--card);
  box-shadow:0 10px 30px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08)}
.lt-tab{flex:1 1 0;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;border:0;border-radius:16px;
  background:none;color:var(--ink);font-size:0;font-weight:700;white-space:nowrap;transition:background .2s,color .2s}
.lt-tab svg{width:22px;height:22px;flex:none}
.lt-tab.on{flex:0 0 94px;width:94px;min-width:0;padding:0 4px;background:var(--tint);color:var(--accent);font-size:12.5px}
.lt-tabbar:not(.lt-plana){gap:2px}
.lt-tabbar:not(.lt-plana) .lt-fab{margin:0 4px 0 2px}
.lt-fab{order:-1;flex:none;width:44px;height:44px;margin:0 6px;border:0;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));box-shadow:0 3px 10px var(--glow);display:inline-flex;align-items:center;justify-content:center}
.lt-fab svg{width:24px;height:24px}
/* Clássico escuro */
.lt[data-escuro="1"]:not([data-visual="bento"]):not([data-visual="aurora"]) .lt-tabbar:not(.lt-plana){background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.45)}
.lt[data-escuro="1"]:not([data-visual="bento"]):not([data-visual="aurora"]) .lt-tabbar:not(.lt-plana) .lt-tab{color:var(--muted)}
.lt[data-escuro="1"]:not([data-visual="bento"]):not([data-visual="aurora"]) .lt-tabbar:not(.lt-plana) .lt-tab.on{color:#fff;background:color-mix(in srgb,var(--a1) 22%,#121416)}
/* Aurora */
.lt[data-visual="aurora"] .lt-tabbar:not(.lt-plana){background:color-mix(in srgb,var(--a2) 12%,#0B1016);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.lt[data-visual="aurora"] .lt-tabbar:not(.lt-plana) .lt-tab{color:rgba(255,255,255,.82)}
.lt[data-visual="aurora"] .lt-tabbar:not(.lt-plana) .lt-tab.on{background:var(--tint);color:color-mix(in srgb,var(--a3) 85%,#000)}
.lt[data-visual="aurora"] .lt-tabbar:not(.lt-plana) .lt-fab{box-shadow:0 0 0 2px rgba(255,255,255,.28),0 3px 10px rgba(0,0,0,.4)}
/* Bento: doca preta, item ativo lima, + em quadrado branco */
.lt[data-visual="bento"] .lt-tabbar:not(.lt-plana){left:12px;right:12px;padding:7px;background:#141416;box-shadow:none}
.lt[data-visual="bento"][data-escuro="1"] .lt-tabbar:not(.lt-plana){background:#1A1A1E;box-shadow:inset 0 0 0 1px #2A2A30}
.lt[data-visual="bento"] .lt-tabbar:not(.lt-plana) .lt-tab{height:46px;border-radius:18px;color:rgba(255,255,255,.62)}
.lt[data-visual="bento"] .lt-tabbar:not(.lt-plana) .lt-tab.on{flex:0 0 94px;width:94px;min-width:0;padding:0 4px;background:var(--lime);color:#141416;font-size:11.5px;font-weight:800}
.lt[data-visual="bento"] .lt-tabbar:not(.lt-plana) .lt-tab svg{width:20px;height:20px}
.lt[data-visual="bento"] .lt-tabbar:not(.lt-plana) .lt-fab{width:46px;height:46px;margin:0 2px;border-radius:16px;background:#fff;color:#141416;box-shadow:none}
.lt[data-visual="bento"][data-escuro="1"] .lt-tabbar:not(.lt-plana) .lt-fab{background:var(--lime)}

/* ---------- Variante plana (tela larga / navegador) ---------- */
.lt-tabbar.lt-plana{left:0;right:0;bottom:0;border-radius:0;gap:0;justify-content:space-around;padding:10px 6px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--line);box-shadow:none}
.lt-plana .lt-tab{flex-direction:column;gap:3px;height:48px;font-size:10.5px;font-weight:600;color:var(--muted);background:none!important;min-width:0;padding:0}
.lt-plana .lt-tab.on{flex:1 1 0;color:var(--accent);font-weight:700}
.lt[data-visual="aurora"] .lt-tabbar.lt-plana{background:color-mix(in srgb,var(--a2) 12%,#0B1016);border-top:0}
.lt[data-visual="aurora"] .lt-plana .lt-tab{color:rgba(255,255,255,.7)}
.lt[data-visual="aurora"] .lt-plana .lt-tab.on{color:#fff}
.lt[data-visual="aurora"] .lt-plana .lt-fab{border-color:#fff}
.lt-plana .lt-fab{order:0;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));width:58px;height:58px;margin:-26px 0 0;border-radius:29px;border:4px solid var(--card);box-shadow:0 8px 18px var(--glow)}

/* =====================================================================
   Clássico no escuro e na cor sólida: textos sobre o fundo
   ===================================================================== */
.lt[data-visual="classico"][data-escuro="1"] .lt-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 55%,#121416),color-mix(in srgb,var(--a2) 55%,#121416) 55%,color-mix(in srgb,var(--a3) 60%,#121416));box-shadow:0 10px 24px rgba(0,0,0,.4)}
.lt[data-visual="classico"][data-escuro="1"] .lt-btn-on{background:#fff;color:#141416}
.lt[data-visual="classico"][data-solido="1"]:not([data-escuro="1"]) .lt-hero{background:var(--card);color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.lt[data-visual="classico"][data-solido="1"]:not([data-escuro="1"]) .lt-hero :is(.lt-pill-on,.lt-hero-item,.lt-btn-on){background:var(--tint);color:var(--accent)}
.lt[data-visual="classico"][data-solido="1"]:not([data-escuro="1"]) .lt-steps span{color:var(--onG)}

/* ---------- Tela larga (computador): conteúdo centralizado ---------- */
@media (min-width:900px){
  .lt-page{max-width:720px;margin:0 auto}
}


/* ===== Versão web (computador): mais espaço ===== */
@media (min-width:900px){
  .lt-page{max-width:none !important}
  .app{max-width:900px !important}
  .lt-tabbar{left:50%;right:auto;width:min(760px,calc(100% - 28px));transform:translateX(-50%)}
}

/* ===== Tela grande (notebook/computador): menu lateral + conteúdo em colunas ===== */
@media (min-width:1000px){
  .lt-tabbar.lt-side{left:16px!important;right:auto!important;top:16px;bottom:16px!important;width:264px;transform:none;flex-direction:column;align-items:stretch;gap:4px;
    padding:20px 14px!important;border-radius:28px!important;overflow-y:auto;border:0;box-shadow:0 12px 36px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06)!important}
  .lt-side .side-brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px;color:var(--ink)}
  .lt-side .side-brand b{display:block;font-size:17px}
  .lt-side .side-brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .lt-side .side-brand .mr-badge{flex:none}

.stack { display: grid; gap: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.green { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.small { padding: 6px 12px; font-size: 13.5px; border-radius: 12px; min-height: 36px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 2px; box-shadow: var(--card-shadow); }
.kpi small { color: var(--muted); font-weight: 600; font-size: 13px; }
.kpi b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.good b { color: var(--green-ink); } .kpi.bad b { color: var(--red-ink); } .kpi.alert b { color: var(--warn); }
.kpi.wide { grid-column: 1 / -1; }

.bars { display: grid; gap: 12px; padding: 16px; }
.bar-l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 5px; }
.bar-l b { font-variant-numeric: tabular-nums; }
.track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; background: var(--red); border-radius: 5px; }
.fill.g { background: var(--green); }
.cols { display: flex; align-items: end; gap: 4px; height: 150px; padding: 22px 16px 0; }
.col { flex: 1; height: 100%; display: flex; align-items: end; justify-content: center; min-width: 0; }
.col i { display: block; width: 100%; max-width: 22px; background: var(--red); border-radius: 6px 6px 2px 2px; min-height: 3px; }
.col i.zero { background: var(--line); }
.rel-cols .col i { max-width: 48px; border-radius: 8px 8px 3px 3px; }
.rel-cols.cols { gap: 5px; }
.col-labels { display: flex; gap: 4px; padding: 6px 16px 14px; border-top: 1px solid var(--line); margin-top: 0; }
.col-labels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); min-width: 0; }

.empty { padding: 26px 16px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty img { width: 64px; }

.qty { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.thumb { width: 52px; height: 52px; border-radius: 15px; background: var(--red-soft); padding: 6px; }

.stop { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; }
.stop .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--surface-2); }
.item.now { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.item.now .n { background: var(--red); color: var(--on-red); }

/* loja do cliente */
.prods { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.prod { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--card-shadow); }
.prod .ph-img { aspect-ratio: 1.15; border-radius: 16px; background: radial-gradient(circle at 50% 40%, #fff3 0, transparent 60%), var(--red-soft); display: grid; place-items: center; }
.prod .ph-img img { width: 72%; filter: drop-shadow(0 8px 10px rgb(120 0 0 / .2)); }
.prod b { font-size: 15.5px; font-weight: 700; line-height: 1.25; }
.prod small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.prod .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.prod .price { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--red); color: var(--on-red); font-weight: 800; font-size: 20px; line-height: 1; display: grid; place-items: center; }
.stepper button.minus { background: var(--surface-2); color: var(--fg); }
.stepper button[disabled] { opacity: .4; }
.stepper span { min-width: 16px; text-align: center; font-weight: 800; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.steps i { height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--green); }
.steps-l { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.steps-l span.on { color: var(--fg); }
.map { border-radius: 16px; background: var(--surface-2); overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.pix { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: 12px; word-break: break-all; }
.totline { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); }
.totline b { font-size: 22px; font-weight: 800; }

/* barra inferior: + à esquerda, item ativo em pílula, demais só ícone */
.nav { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(452px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); background: var(--nav-bg); border-radius: 30px; box-shadow: 0 10px 30px rgb(0 0 0 / .14), 0 0 0 1px var(--line); display: flex; align-items: center; gap: 8px; padding: 8px; }
.nv-row { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 2px; min-width: 0; }
.nv { position: relative; border: 0; background: transparent; color: var(--fg); height: 50px; min-width: 44px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 15px; }
.nv svg { width: 25px; height: 25px; }
.nv.on { background: var(--red-soft); color: var(--red-ink); padding: 0 18px; flex: 1 1 auto; max-width: 160px; }
.nv span:not(.cnt) { white-space: nowrap; }
.nv .cnt, .fab .cnt { position: absolute; top: 4px; right: 2px; background: var(--red); color: var(--on-red); font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 0 5px; line-height: 16px; border: 2px solid var(--nav-bg); }
.fab { flex: none; position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; background: linear-gradient(160deg, var(--red-2), var(--red) 55%, var(--red-3)); color: #fff; box-shadow: 0 8px 18px rgb(227 23 10 / .35); display: grid; place-items: center; }
.fab svg { width: 28px; height: 28px; }

/* folhas (bottom sheets) */
.overlay, .sheet { position: fixed; inset: 0; z-index: 50; background: var(--sheet-scrim); display: flex; align-items: flex-end; justify-content: center; }
.modal, .sheet-in { background: var(--surface); width: min(480px, 100%); max-height: 92vh; overflow: auto; border-radius: 28px 28px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -10px 40px rgb(0 0 0 / .2); }
.modal::before, .sheet-in::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 0; }
.modal-h { padding: 12px 20px 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-h h2, .sheet-in h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.modal form { padding: 8px 20px 22px; display: grid; gap: 14px; }
.sheet-in { padding: 0 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-in h2 { margin-top: 12px; }
.menu { display: grid; gap: 8px; }
.menu button { display: grid; grid-template-columns: 46px minmax(0, 1fr) 20px; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 18px; padding: 10px 12px; color: inherit; }
.menu button .chipico { width: 46px; height: 46px; border-radius: 14px; }
.menu button b { display: block; font-weight: 700; }
.menu button small { color: var(--muted); font-size: 13px; }
.menu button[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.f { display: grid; gap: 6px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label, .f .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type=text], input[type=number], input[type=tel], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 11px 13px; min-width: 0; font-size: 16px; }
textarea { min-height: 80px; resize: vertical; }
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 16px; }
.line select { grid-column: 1 / -1; }
.line-h { display: none; }
.x { border: 0; background: var(--surface-2); border-radius: 12px; width: 40px; height: 44px; font-weight: 800; color: var(--muted); font-size: 18px; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); }
.total-row b { font-size: 24px; font-weight: 800; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; }
.opt span { display: inline-block; border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; font-weight: 700; font-size: 14px; background: var(--bg); }
.opt input:checked + span { border-color: var(--red); background: var(--red-soft); color: var(--red-ink); }
.opt input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 2px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.switch input { width: 22px; height: 22px; accent-color: var(--green); }
.form-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.form-acts .btn { flex: 1; }
.banner { border-radius: 20px; padding: 16px 18px; display: grid; gap: 4px; color: #fff; position: relative; overflow: hidden; min-height: 96px; background: linear-gradient(150deg, #F0453A, #E3170A 50%, #B80F08); }
.banner.folha { background: linear-gradient(150deg, #4DAF39, #2E8B22 50%, #1C5F13); }
.banner.preto { background: linear-gradient(150deg, #2A292F, #0B0B0C); }
.banner b { font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .02em; line-height: 1.1; padding-right: 64px; }
.banner p { margin: 0; font-size: 14px; opacity: .95; padding-right: 64px; }
.banner img { position: absolute; right: -6px; bottom: -10px; width: 82px; transform: rotate(-10deg); }
.banner.off { opacity: .45; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-weight: 700; box-shadow: 0 8px 24px rgb(0 0 0 / .2); width: max-content; max-width: calc(100% - 32px); }

@media (max-width: 360px) { .tiles, .prods { gap: 10px; } .tile { padding: 14px; } .nv.on { padding: 0 12px; } .nv.on span { display: none; } .fgrid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* ===== v3: faixa preta da marca, atalhos rápidos, cartões "Agora", barra de abas ===== */
:root { --band: #0B0B0C; --band-fg: #F1EFF4; --band-muted: #A9A4B2; --band-line: rgb(255 255 255 / .12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --band: #141317; } }
:root[data-theme="dark"] { --band: #141317; }
.bgglow { display: none; }
body { margin: 0; }
.band-note { margin-top: 12px; background: rgb(245 180 67 / .14); color: #F5C46B; }
body::before { background: var(--band); }
.app { padding-block: 0 120px; gap: 16px; }
.band { margin-inline: calc(-1 * max(18px, env(safe-area-inset-left, 0px))) calc(-1 * max(18px, env(safe-area-inset-right, 0px))); padding: 12px max(18px, env(safe-area-inset-right, 0px)) 70px max(18px, env(safe-area-inset-left, 0px)); background: radial-gradient(120% 80% at 100% 0%, rgb(227 23 10 / .32) 0%, transparent 55%), radial-gradient(80% 60% at 0% 100%, rgb(46 139 34 / .18) 0%, transparent 60%), var(--band); color: var(--band-fg); border-radius: 0 0 30px 30px; display: grid; gap: 4px; }
.band-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.band-logo { width: 84px; height: 84px; margin: -6px 0 -6px -8px; }
.band-right { display: flex; align-items: center; gap: 8px; }
.mode-pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--band-line); background: rgb(255 255 255 / .06); color: var(--band-fg); border-radius: 999px; padding: 8px 12px 8px 16px; font-weight: 700; font-size: 14px; }
.mode-pill svg { width: 18px; height: 18px; }
.band-ic { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--band-line); background: rgb(255 255 255 / .06); color: var(--band-fg); display: grid; place-items: center; }
.band-ic svg { width: 21px; height: 21px; }
.band-ic .dot { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--red-2); border: 2px solid var(--band); }
.band-greet { color: var(--band-muted); font-size: 14px; font-weight: 600; text-transform: capitalize; }
.band-label { color: var(--band-muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
.band-big { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 12vw, 52px); letter-spacing: .02em; line-height: 1; }
.band-sub { color: var(--band-muted); font-size: 14.5px; }
.band-hello { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9.5vw, 42px); letter-spacing: .02em; line-height: 1.05; margin-top: 6px; }
.band-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.band-stats button { text-align: left; border: 1px solid var(--band-line); background: rgb(255 255 255 / .06); color: var(--band-fg); border-radius: 16px; padding: 9px 11px; min-width: 0; }
.band-stats small { display: block; color: var(--band-muted); font-size: 12px; font-weight: 600; }
.band-stats b { display: block; font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band-stats b.neg { color: #FF8A80; }
.band-page { padding-bottom: 18px; }
.pg-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding-top: 2px; }
.pg-row h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .02em; line-height: 1.05; }
.pg-back { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--band-line); background: rgb(255 255 255 / .06); color: var(--band-fg); display: grid; place-items: center; }
.pg-right .btn { background: var(--red); border-color: var(--red); color: var(--on-red); }
.pg-right .btn:not(.primary) { background: rgb(255 255 255 / .1); border-color: var(--band-line); color: var(--band-fg); }

.quick { margin-top: -56px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 14px 8px; position: relative; }
.qa { border: 0; background: transparent; display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 13.5px; color: var(--fg); padding: 4px 0; border-radius: 14px; }
.qa-ic { width: 54px; height: 54px; border-radius: 18px; background: var(--red-soft); color: var(--red-ink); display: grid; place-items: center; }
.qa:first-child .qa-ic { background: var(--red); color: var(--on-red); box-shadow: 0 6px 14px rgb(227 23 10 / .3); }
.qa:hover .qa-ic { filter: brightness(.97); }

.now-row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px; padding: 2px 18px 6px; scrollbar-width: none; }
.now-row::-webkit-scrollbar { display: none; }
.now { scroll-snap-align: start; flex: 0 0 min(230px, 70%); border: 0; text-align: left; border-radius: 22px; padding: 14px; display: grid; gap: 2px; color: inherit; min-height: 168px; align-content: start; }
.now-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 8px; background: rgb(255 255 255 / .18); }
.now-ic svg { width: 20px; height: 20px; }
.now-big { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
.now-l { font-weight: 700; font-size: 15px; }
.now-s { font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now-btn { margin-top: 10px; display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: 14px; }
.now-btn svg { width: 16px; height: 16px; }
.now.red { background: linear-gradient(155deg, #F2463B, #E3170A 55%, #B80F08); color: #fff; box-shadow: 0 10px 22px rgb(227 23 10 / .25); }
.now.dark { background: var(--band); color: var(--band-fg); }
.now.dark .now-ic { background: rgb(92 196 74 / .2); color: #7EDB6C; }
.now.green { background: var(--green-soft); color: var(--green-ink); }
.now.green .now-ic { background: var(--green); color: var(--on-green); }
.now.blue { background: var(--blue-soft); color: var(--blue); }
.now.blue .now-ic { background: var(--blue); color: var(--surface); }
.now.warn { background: var(--warn-soft); color: var(--warn); }
.now.warn .now-ic { background: var(--warn); color: var(--surface); }
.calm { display: flex; gap: 14px; align-items: center; padding: 14px 16px; }
.calm b { display: block; } .calm small { color: var(--muted); }

.menu-list { display: grid; padding: 4px 0; }
.ml { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 18px; gap: 12px; align-items: center; border: 0; background: transparent; color: inherit; text-align: left; padding: 11px 16px; border-top: 1px solid var(--line); }
.ml:first-child { border-top: 0; }
.ml:hover { background: var(--surface-2); }
.ml-ic { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); color: var(--fg); display: grid; place-items: center; }
.ml-ic svg { width: 20px; height: 20px; }
.ml-l { font-weight: 700; font-size: 15.5px; }
.ml-v { color: var(--muted); font-size: 14px; font-weight: 600; }
.ml .chev { width: 18px; height: 18px; }
.feed-card { padding: 0 16px; }

.news-row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: -56px -18px 0; padding: 0 18px 6px; scrollbar-width: none; position: relative; }
.news-row::-webkit-scrollbar { display: none; }
.news { scroll-snap-align: start; flex: 0 0 min(400px, 86%); position: relative; overflow: hidden; border-radius: 24px; padding: 16px 18px 18px; color: #fff; min-height: 150px; display: grid; align-content: start; gap: 4px; background: linear-gradient(155deg, #F2463B, #E3170A 55%, #B80F08); box-shadow: 0 12px 26px rgb(0 0 0 / .2); }
.news:only-child { flex-basis: 100%; }
.news.folha { background: linear-gradient(155deg, #4DAF39, #2E8B22 55%, #1C5F13); }
.news.preto { background: linear-gradient(155deg, #2A292F, #0B0B0C); border: 1px solid rgb(255 255 255 / .1); }
.news-tag { justify-self: start; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: rgb(255 255 255 / .2); border-radius: 999px; padding: 3px 10px; }
.news h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 25px; letter-spacing: .02em; line-height: 1.05; padding-right: 84px; }
.news p { margin: 0; font-size: 14px; opacity: .95; padding-right: 84px; }
.news img { position: absolute; right: -10px; bottom: -14px; width: 108px; transform: rotate(-12deg); filter: drop-shadow(0 8px 12px rgb(0 0 0 / .25)); }
.order-strip { display: grid; grid-template-columns: 52px minmax(0, 1fr) 20px; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 20px; padding: 12px 14px; box-shadow: var(--card-shadow); }
.order-strip small { display: block; color: var(--green-ink); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.order-strip b { display: block; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* contornos e cantos */

.menu-list { padding: 6px 0; }
.ml { padding: 12px 16px; grid-template-columns: 48px minmax(0, 1fr) auto 20px; gap: 14px; border-top: 1px solid var(--outline); }

.chipico { background: var(--chip); color: var(--chip-fg); border-radius: 16px; }

.feed-card { padding: 0 18px; }

.news-row { margin-top: 6px; }
.news { border-radius: 30px; padding: 20px; min-height: 168px; background: radial-gradient(110% 80% at 90% 0%, #FF5A66 0%, transparent 60%), linear-gradient(155deg, #F6404F 0%, #E3170A 52%, #C3103A 100%); box-shadow: 0 16px 34px rgb(227 23 50 / .25); }
.news-tag { font-weight: 600; letter-spacing: .02em; text-transform: none; font-size: 14px; padding: 5px 12px; background: rgb(255 255 255 / .22); }

.order-strip { padding: 14px 16px; }
.order-strip small { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13.5px; }
.order-strip b { font-weight: 600; font-size: 16.5px; }
.mp { padding: 12px; }
.mp-img { border-radius: 18px; background: var(--chip); }
.mp-body b { font-weight: 600; }
.mp-foot .price { font-weight: 700; }
.add-btn { font-weight: 600; padding: 10px 18px; background: linear-gradient(155deg, #F6404F, #E3170A); box-shadow: 0 6px 14px rgb(227 23 50 / .25); }
.stepper button { border-radius: 12px; background: linear-gradient(155deg, #F6404F, #E3170A); }
.stepper button.minus { background: var(--chip); color: var(--chip-fg); }
.chip { border: 1.5px solid var(--outline); font-weight: 500; padding: 9px 16px; }
.chip[aria-pressed="true"] { background: var(--chip); color: var(--chip-fg); border-color: transparent; font-weight: 600; }
.pill { font-weight: 600; padding: 5px 11px; }
.btn { border: 1.5px solid var(--outline); border-radius: 999px; font-weight: 600; }

.hero, .banner { border-radius: 30px; }
input[type=text], input[type=number], input[type=tel], input[type=date], select, textarea { border: 1.5px solid var(--outline); border-radius: 16px; background: var(--surface); }

/* barra de abas flutuante, aba ativa em pílula */
.tabbar { left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(456px, calc(100% - 24px)); border: 1.5px solid var(--outline); border-radius: 32px; padding: 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; box-shadow: 0 12px 34px rgb(60 10 20 / .14); }
.tb { flex: 0 0 auto; height: 54px; min-width: 50px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg); font-size: 16px; font-weight: 500; }
.tb svg { width: 26px; height: 26px; }

.cart-bar { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); border-radius: 22px; background: linear-gradient(155deg, #F6404F, #E3170A 60%, #C3103A); color: #fff; box-shadow: 0 12px 28px rgb(227 23 50 / .3); }
.cart-bar span { color: rgb(255 255 255 / .85); }

/* ===== v6: o app usando o pacote LivTask. Os tokens do app passam a vir das variáveis do pacote ===== */
.lt {
  --bg: var(--ground); --surface: var(--card); --surface-2: color-mix(in srgb, var(--line) 45%, var(--card)); --fg: var(--ink);
  --red: var(--a2); --red-2: var(--a1); --red-3: var(--a3); --on-red: var(--onA); --red-soft: var(--tint); --red-ink: var(--accent);
  --chip: var(--tint); --chip-fg: var(--accent); --outline: var(--line);
  --green: var(--okc); --on-green: var(--card); --green-soft: var(--okBg); --green-ink: var(--okc);
  --warn-soft: var(--warnBg); --blue: var(--info); --blue-soft: var(--infoBg);
  --card-shadow: var(--sh1); --nav-bg: var(--card);
  --body: var(--ff); --display: var(--fh);
  --grad: linear-gradient(135deg, var(--a1) 0%, var(--a2) 55%, var(--a3) 100%);
}
body.lt { background: var(--page-bg); color: var(--ink); font-family: var(--ff); font-size: var(--fs-md); }
body.lt::before { background: var(--g1, var(--ground)); }
.lt[data-visual="aurora"]::before { background: color-mix(in srgb, var(--a2) 80%, #0B1016); }
.lt[data-visual="bento"]::before { background: var(--ground); }
.app { padding: 12px var(--sp-page) 116px; gap: var(--sp-gap); }

/* topo */
.lt-top { gap: 4px; }
.mr-badge { width: 26px; height: 26px; border-radius: 8px; background: #0B0B0C !important; }
.mr-badge img { width: 20px; height: 20px; }
.lt[data-visual="bento"] .mr-badge { border-radius: 50%; }
.lt-company svg.i { width: 16px; height: 16px; }
.lt-iconbtn svg.i { width: 22px; height: 22px; }
.lt-title { font-size: clamp(26px, 7.4vw, 30px); }
.mr-sub { color: var(--on-page-muted); font-size: 13.5px; font-weight: 500; }
.lt-head .lt-back svg.i { width: 20px; height: 20px; }
.lt-head h1 { font-size: 22px; }
.pg-right .btn { white-space: nowrap; }

/* cartão de destaque */
.lt-hero { gap: 8px; }
.mr-big { font-family: var(--fh); font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin: 0 0 4px; }
.lt-hero-item { min-height: 38px; }
.lt-hero-item svg.i { width: 16px; height: 16px; }
.lt-hero-foot span { opacity: .92; }
.mr-hero-sub { font-size: 13px; font-weight: 600; opacity: .92; margin: 0 0 4px; }
.lt-hero-foot .lt-btn-on { white-space: nowrap; }

/* títulos de seção e textos direto no fundo */
.sec-h { margin: 0 0 -8px; align-items: center; }
.sec-h h2 { font-family: var(--fh); font-size: var(--fs-md); font-weight: 700; color: var(--on-page); letter-spacing: normal; }
.sec-h .muted, .app > .sub, .app > p.sub, .app > .stack > p.sub { color: var(--on-page-muted) !important; }
.link { color: var(--on-page-link); font-size: 13px; font-weight: 600; }
.lt[data-visual="aurora"] .sec-h h2 { font-size: 12.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--on-page-muted); }
.lt[data-visual="bento"] .sec-h h2 { font-size: 16px; letter-spacing: -.02em; }
.lt[data-visual="bento"] .link { background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; }

/* cartões */
.card, .item, .kpi, .rowcard, .order-strip, .mp, .quick, .now, .ap-opt { background: var(--card); color: var(--ink); border: var(--bd); border-radius: var(--r-card); box-shadow: var(--sh1); }
.item { padding: 14px var(--sp-card-x); gap: 8px; }
.kpi { padding: 14px var(--sp-card-x); }
.kpi b { font-family: var(--fh); font-weight: 700; font-size: 20px; }
.item-top b, .mp-body b, .order-strip b { font-weight: var(--fw-row); }
.item small, .kpi small, .kpi .s, .mp-body small { color: var(--muted); }

/* ícones em quadradinhos (lt-ico) */
.chipico, .ml-ic, .qa-ic, .now-ic, .menu button .chipico { width: var(--ico); height: var(--ico); border-radius: var(--r-ico); background: var(--tint); color: var(--accent); }
.chipico svg.i, .ml-ic svg.i, .now-ic svg.i { width: 20px; height: 20px; }
.rowcard, .order-strip { grid-template-columns: var(--ico) minmax(0, 1fr) 18px; padding: 12px var(--sp-card-x); }
.lt[data-visual="aurora"] :is(.chipico, .ml-ic, .now-ic, .qa-ic) { background: linear-gradient(135deg, color-mix(in srgb, var(--a1) 18%, var(--card)), color-mix(in srgb, var(--a2) 26%, var(--card))); }
.lt[data-visual="bento"] :is(.chipico, .ml-ic, .qa-ic, .now-ic) { background: var(--jet); color: var(--card); }
.chipico.g { background: var(--okBg); color: var(--okc); }

/* atalhos rápidos */
.quick { padding: 14px 6px 12px; margin: 0; }
.qa { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.qa-ic { width: 48px; height: 48px; border-radius: calc(var(--r-ico) + 4px); }
.qa-ic svg.i { width: 22px; height: 22px; }
.qa:first-child .qa-ic { background: var(--grad); color: var(--onA); box-shadow: 0 6px 14px var(--glow); }
.lt[data-visual="bento"] .qa:first-child .qa-ic { background: var(--lime); color: #141416; box-shadow: none; }

/* cartões "Agora" (seguem os tiles do pacote) */
.now { min-height: 150px; padding: 14px; gap: 2px; }
.now-big { font-family: var(--fh); font-size: 26px; font-weight: 700; color: var(--ink); }
.now-l { font-weight: 600; font-size: 14px; }
.now-s { color: var(--muted); }
.now-btn { color: var(--accent); font-weight: 700; font-size: 13px; }
.now.red { background: var(--grad); color: #fff; border: 0; box-shadow: 0 10px 24px var(--glow); }
.now.red .now-big, .now.red .now-s, .now.red .now-btn { color: #fff; }
.now.red .now-ic { background: rgb(255 255 255 / .2); color: #fff; }
.now.dark .now-ic, .now.green .now-ic { background: var(--okBg); color: var(--okc); }
.now.green .now-big { color: var(--okc); }
.now.blue .now-ic { background: var(--infoBg); color: var(--info); }
.now.warn .now-ic { background: var(--warnBg); color: var(--warn); }
.now.warn .now-big { color: var(--warn); }
.lt[data-visual="bento"] .now { border: 0; color: var(--onT); }
.lt[data-visual="bento"] .now :is(.now-big, .now-l, .now-btn) { color: var(--onT); }
.lt[data-visual="bento"] .now .now-s { color: var(--onT2); }
.lt[data-visual="bento"] .now .now-ic { background: #141416; color: var(--tc, var(--lime)); }
.lt[data-visual="bento"] .now:nth-child(6n+1) { --tc: var(--lime); background: var(--lime); }
.lt[data-visual="bento"] .now:nth-child(6n+2) { --tc: var(--lilac); background: var(--lilac); }
.lt[data-visual="bento"] .now:nth-child(6n+3) { --tc: var(--peach); background: var(--peach); }
.lt[data-visual="bento"] .now:nth-child(6n+4) { --tc: var(--sky); background: var(--sky); }
.lt[data-visual="bento"] .now:nth-child(6n+5) { --tc: var(--mint); background: var(--mint); }
.lt[data-visual="bento"] .now:nth-child(6n+6) { --tc: var(--butter); background: var(--butter); }
/* "Agora" compacto: cartões menores, cabem mais na tela */
/* "Agora" alinhado com o card Vendas de hoje: começa na mesma margem e os cartões encaixam nela ao rolar */
.now-row { gap: 10px; margin: 0 calc(-1 * var(--sp-page)); padding: 2px var(--sp-page) 6px; scroll-padding-inline: var(--sp-page); }
.now { flex: 0 0 min(150px, 42%); min-height: 0; padding: 11px 12px; gap: 1px; border-radius: 18px; }

  background: color-mix(in srgb, var(--tint) 92%, var(--card)); box-shadow: 0 18px 40px rgb(0 0 0 / .22); display: grid; gap: 12px; animation: fabUp .18s ease-out; }

.vsel.cx-per { grid-template-columns: minmax(0, 1fr); }

form .is-off { opacity: .55; }
.fab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fab-tile { display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 78px; padding: 12px 6px; border: 0; border-radius: 18px;

/* todas as janelas do app usam o estilo do painel do + */

.lt[data-visual="aurora"] .fab-pop .fgrid, .lt[data-visual="aurora"] .fab-pop form > p, .lt[data-visual="aurora"] .fab-pop .pop-panel, .lt[data-visual="aurora"] .fab-pop .ap-sec, .lt[data-visual="aurora"] .fab-pop .menu button { background: var(--fill); }

/* janela padrão do app: folha branca que sobe do rodapé (alça, título grande e X) */

.bs { width: min(560px, 100%); max-height: 90dvh; overflow: auto; overscroll-behavior: contain; background: var(--card); color: var(--ink); border-radius: 28px 28px 0 0;
  padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgb(0 0 0 / .18); display: grid; gap: 14px; align-content: start; animation: bsUp .22s ease-out; }

@media (prefers-reduced-motion: reduce) { .bs, .bs-scrim { animation: none; } }
/* seletores da tela Vendas */

.cal-nav .cal-mes { width: auto; color: var(--ink); font-size: 20px; font-weight: 800; display: inline-flex; gap: 8px; padding: 0 10px; border-radius: 12px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; justify-items: center; }
.cal-wd { padding: 10px 0 6px; font-size: 13.5px; color: var(--muted); }
.cal-d { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--ink); font: inherit; font-size: 16.5px; font-variant-numeric: tabular-nums; }
.cal-d.out { color: var(--muted2, #B9B4B6); }
.cal-d.hoje { color: var(--accent); font-weight: 800; }
.cal-d[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 800; }
.cal-d:disabled { opacity: .3; }
.cal-ms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 6px 0; }
.cal-m { height: 52px; border: 1px solid var(--line); border-radius: 16px; background: none; color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; }
.cal-m[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.cal-ok { height: 54px; margin-top: 10px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 700; }
.cal-ok:disabled { background: color-mix(in srgb, var(--ink) 8%, var(--card)); color: var(--muted2, #A8A3A5); }
.lt[data-escuro="1"] :is(.cal-d[aria-pressed="true"], .cal-m[aria-pressed="true"], .cal-ok:not(:disabled)) { color: var(--card); }
.lt[data-visual="bento"] :is(.cal-d[aria-pressed="true"], .cal-m[aria-pressed="true"], .cal-ok:not(:disabled)) { background: var(--jet); border-color: var(--jet); color: var(--ground); }
/* filtro da tela Vendas */
.vf-bar { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--ink); font: inherit; font-size: 14.5px; }
.vf-bar svg.i { width: 20px; height: 20px; color: var(--accent); flex: none; }
.vf-bar .lt-grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vf-bar small { color: var(--muted); font-size: 12.5px; display: block; }
@keyframes fabUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fab-pop { animation: none; } }
@media (min-width: 520px) { .fab-pop { left: 50%; right: auto; width: 452px; transform: translateX(-50%); animation: none; } }

/* Aparência */
.ap-sec { display: grid; gap: 8px; }
.ap-l { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ap-vis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ap-opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; box-shadow: none; display: grid; gap: 2px; }
.ap-opt b { font-size: 14px; } .ap-opt small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.ap-opt[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--tint); }
.ap-cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; }
.ap-cor { aspect-ratio: 1; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center; }
.ap-cor[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.ap-cor[disabled], .lt-chip[disabled] { opacity: .35; cursor: not-allowed; }
.ap-cor svg.i { width: 18px; height: 18px; }
.sheet-in .lt-chips { flex-wrap: wrap; }

/* ---------- Chat (cliente ↔ gestão) · componentes lt-msgs/lt-bubble/lt-composer do pacote LivTask ---------- */

.chat-dia{align-self:center;font-size:11.5px;font-weight:700;color:var(--on-page-muted);background:color-mix(in srgb,var(--card) 70%,transparent);padding:3px 10px;border-radius:999px;margin:6px 0 2px}

/* ===== Cabeçalho fixo: o topo de cada tela fica parado enquanto o conteúdo rola ===== */
.app > :is(.lt-top, .lt-head, .lt-headbox):first-child {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  margin: -12px calc(-1 * var(--sp-page)) 0; padding: 12px var(--sp-page) 10px;
  background: var(--page-bg); background-attachment: fixed;
  transition: box-shadow .2s;
}

<script>
(() => {
'use strict';
/* ---------------- utilidades ---------------- */
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = v => BRL.format(Number(v) || 0);
const n2 = v => Math.round((Number(v) || 0) * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtNum = v => (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const fmtDT = ts => new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const startOfDay = (d = new Date()) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const FORMAS = { pix: 'Pix', dinheiro: 'Dinheiro', debito: 'Cartão de débito', credito: 'Cartão de crédito', fiado: 'Fiado (a prazo)', cartao_entrega: 'Cartão na entrega' };
const STATUS = { recebido: 'Recebido', separado: 'Separado', em_rota: 'Saiu para entrega', entregue: 'Entregue', cancelado: 'Cancelado' };
const STATUS_PILL = { recebido: 'p-blue', separado: 'p-gray', em_rota: 'p-red', entregue: 'p-ok', cancelado: 'p-gray' };
const PERIODOS = { hoje: 'Hoje', '7d': '7 dias', '30d': '30 dias', mes: 'Este mês', tudo: 'Tudo' };
const CATS = { combustivel: 'Combustível', embalagem: 'Embalagens', manutencao: 'Manutenção', pessoal: 'Ajudante / diárias', outros: 'Outros' };
const MIN_PER_STOP = 12;
/* cliente de teste: cadastrado na Gestão e já logado na Loja deste aparelho */
const TESTE_ID = 'cliente-teste';
const TESTE = { nome: 'Cliente Teste', tipo: 'pessoa', telefone: '(15) 99999-0000', cep: '18170000', endereco: 'Rua das Flores', numero: '200', bairro: 'Centro', cidade: 'Piedade / SP', referencia: 'Conta de teste', obs: 'Cliente usado para testar a Loja' };
const TESTE_END = 'Rua das Flores, 200 · Centro';
let testeOk = false;
function ensureTeste() {
  if (testeOk || backend === 'pending' || !COLS.every(k => loaded[k])) return;
  testeOk = true;
  const d = ls.get('mmr-cliente', {});
  if (!d.nome) ls.set('mmr-cliente', { nome: TESTE.nome, telefone: TESTE.telefone, endereco: TESTE_END, clienteId: TESTE_ID });
  if (canWrite && !S.clientes.some(c => c.id === TESTE_ID) && !ls.get('mmr-teste-criado', false)) {
    ls.set('mmr-teste-criado', true);
    put('clientes', TESTE_ID, { ...TESTE, ts: Date.now() }).catch(() => {});
  }
}
const C_ST = { recebido: 'Recebido', separado: 'Separado', em_rota: 'A caminho', entregue: 'Entregue', cancelado: 'Cancelado' };
/* card da Loja: mesmas 5 linhas do card padronizado da Gestão, sem "Editar" */
const ccard = ({ cls = '', title, val, meta, det, pills, acts }) => `<article class="item tc c-tc ${cls}">
    <div class="tc-l1"><b class="tc-t">${esc(title)}</b><span class="val">${val}</span></div>
    <small class="tc-1"><span>${meta || '&nbsp;'}</span></small>
    <small class="tc-1"><span>${det || '&nbsp;'}</span></small>
    <div class="tc-f"><div class="pills">${pills || ''}</div></div>
    <div class="acts">${acts || ''}</div>
  </article>`;

function inPeriod(ts, p) {
  const now = new Date();
  if (p === 'tudo') return true;
  if (p === '_r') return _rng ? ts >= _rng[0] && ts < _rng[1] : true;
  if (p === 'hoje') return ts >= startOfDay(now);
  if (p === '7d') return ts >= startOfDay(now) - 6 * 864e5;
  if (p === '30d') return ts >= startOfDay(now) - 29 * 864e5;
  if (p === 'mes') return ts >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  if (p === 'rcustom') { const a = ui.rDe ? new Date(ui.rDe + 'T00:00').getTime() : -Infinity; const b = ui.rAte ? new Date(ui.rAte + 'T00:00').getTime() + 864e5 : Infinity; return ts >= a && ts < b; }
  if (p === 'ccustom') { const a = ui.cDe ? new Date(ui.cDe + 'T00:00').getTime() : -Infinity; const b = ui.cAte ? new Date(ui.cAte + 'T00:00').getTime() + 864e5 : Infinity; return ts >= a && ts < b; }
  if (p === 'kcustom') { const a = ui.kDe ? new Date(ui.kDe + 'T00:00').getTime() : -Infinity; const b = ui.kAte ? new Date(ui.kAte + 'T00:00').getTime() + 864e5 : Infinity; return ts >= a && ts < b; }
  if (p === 'ecustom') { const a = ui.eDe ? new Date(ui.eDe + 'T00:00').getTime() : -Infinity; const b = ui.eAte ? new Date(ui.eAte + 'T00:00').getTime() + 864e5 : Infinity; return ts >= a && ts < b; }
  if (p === 'custom') { const a = ui.vDe ? new Date(ui.vDe + 'T00:00').getTime() : -Infinity; const b = ui.vAte ? new Date(ui.vAte + 'T00:00').getTime() + 864e5 : Infinity; return ts >= a && ts < b; }
  return true;
}

/* ---------------- dados ---------------- */
const COLS = ['produtos', 'vendas', 'compras', 'despesas', 'noticias', 'clientes', 'mensagens', 'fornecedores', 'notificacoes'];
const S = { produtos: [], vendas: [], compras: [], despesas: [], noticias: [], clientes: [], mensagens: [], fornecedores: [], notificacoes: [] };
const loaded = {};
let backend = 'pending'; // 'db' | 'local'
let db = null;
let canWrite = true;
let loadTimer = null, loadSlow = false;

const local = {
  key: 'mmr-demo-v1',
  data: null,
  load() { this.data = ls.get(this.key, null) || {}; for (const c of COLS) if (!this.data[c]) this.data[c] = {}; },
  persist() { ls.set(this.key, this.data); },
};

async function put(col, id, body) {
  if (backend === 'db') { await db.collection(col).doc(id).set(body); }
  else { local.data[col][id] = body; local.persist(); syncLocal(col); }
}
async function patch(col, id, body) {
  if (backend === 'db') { await db.collection(col).doc(id).update(body); }
  else { local.data[col][id] = { ...local.data[col][id], ...body }; local.persist(); syncLocal(col); }
}
async function del(col, id) {
  if (backend === 'db') { await db.collection(col).doc(id).delete(); }
  else { delete local.data[col][id]; local.persist(); syncLocal(col); }
}
function syncLocal(col) { S[col] = Object.entries(local.data[col]).map(([id, v]) => ({ id, ...v })); loaded[col] = true; scheduleRender(); }

async function safe(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === 'invalid_argument' && backend === 'db') { canWrite = false; renderStatus(); toast('Você não tem permissão para alterar os dados desta página.'); }
    else if (code === 'quota_exceeded') toast('O espaço de dados está cheio. Apague registros antigos para continuar.');
    else toast('Não deu para salvar agora. Tente de novo em instantes.');
    console.error(e); return false;
  }
}

async function boot() {
  try {
    const use = window.claude && window.claude.use;
    db = use ? await window.claude.use('db') : null;
  } catch { db = null; }
  if (db) {
    backend = 'db';
    try { const user = await window.claude.use('user'); if (user) { const c = await user.can('data.write'); if (c === false) canWrite = false; } } catch {}
    loadTimer = setTimeout(() => { loadSlow = true; renderStatus(); }, 10000);
    for (const c of COLS) {
      db.collection(c).onSnapshot(snap => {
        S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) loaded[c] = true;
        if (COLS.every(k => loaded[k])) { clearTimeout(loadTimer); loadSlow = false; }
        renderStatus(); scheduleRender();
      }, () => { loaded[c] = true; clearTimeout(loadTimer); loadSlow = false; renderStatus(); toast('Uma parte dos dados não pôde ser lida.'); });
    }
  } else {
    backend = 'local';
    local.load();
    if (!Object.keys(local.data.produtos).length) seedLocal();
    COLS.forEach(syncLocal);
    autoExemplos();
  }
  renderStatus(); render();
}
