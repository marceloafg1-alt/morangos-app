/* HTML offline: já abre com todos os dados de exemplo, com datas relativas ao dia de abertura.
   Num dia novo, os exemplos são recriados com datas recentes (seus dados reais não mudam).
   Se você remover os exemplos, eles não voltam sozinhos; se inserir pela tela de exemplos, ficam como escolheu. */
const AUTO_EX_KEY = 'mmr-ex-auto';
function autoExemplos() {
  if (backend !== 'local') return;
  const st = ls.get(AUTO_EX_KEY, {}) || {};
  const hoje = dayKey(Date.now());
  if (st.removidos || st.manual || st.dia === hoje) return;
  for (const c of COLS) for (const [id, d] of Object.entries(local.data[c])) if (ehExemplo(c, { id, ...d })) delete local.data[c][id];
  if (!st.dia) { // sobras da versão antiga do arquivo (Caixa 4 kg e notícia de demonstração)
    const usado = id => ['vendas', 'compras'].some(c => Object.entries(local.data[c]).some(([, d]) => (d.itens || []).some(i => i.produtoId === id)));
    if (local.data.produtos.cx4?.nome === 'Caixa 4 kg (atacado)' && !usado('cx4')) delete local.data.produtos.cx4;
    if (local.data.noticias.n1?.titulo === 'Colheita de hoje!') delete local.data.noticias.n1;
  }
  COLS.forEach(c => { S[c] = Object.entries(local.data[c]).map(([id, v]) => ({ id, ...v })); });
  const data = montarExemplos();
  for (const [col, docs] of Object.entries(data)) Object.assign(local.data[col], docs);
  local.persist();
  COLS.forEach(syncLocal);
  // pedido de exemplo no app do cliente, para ver o acompanhamento da rota
  const meu = EX_PREFIX + 'v-h3';
  let ped = (ls.get('mmr-meus-pedidos', []) || []).filter(id => !String(id).startsWith(EX_PREFIX) || local.data.vendas[id]);
  if (!ped.includes(meu)) ped = [meu, ...ped].slice(0, 30);
  ls.set('mmr-meus-pedidos', ped);
  myOrders = ped;
  ls.set(AUTO_EX_KEY, { dia: hoje });
}

function catDoExemplo(col, d) {
  if (col === 'vendas' && d.clienteId === TESTE_ID) return 'historico';
  if (col === 'vendas') return 'vendas-' + (d.origem === 'chat' ? 'chat' : d.origem === 'avulsa' ? 'avulsa' : 'app');
  if (col === 'mensagens') return 'conversas';
  return col;
}
// Conta quantos exemplos existem de cada categoria. Conversa = um cliente com suas mensagens.
function contaPorCat(data) {
  const n = Object.fromEntries(EX_CATS.map(c => [c.k, 0]));
  for (const [col, docs] of Object.entries(data)) {
    if (col === 'mensagens') { n.conversas = new Set(Object.values(docs).map(m => m.clienteId)).size; continue; }
    for (const d of Object.values(docs)) n[catDoExemplo(col, d)]++;
  }
  return n;
}
function filtrarExemplos(data, qtd) {
  const out = {}, usados = {}, convs = [];
  for (const [col, docs] of Object.entries(data)) {
    out[col] = {};
    for (const [id, d] of Object.entries(docs)) {
      const c = catDoExemplo(col, d);
      if (c === 'conversas') { if (!convs.includes(d.clienteId)) convs.push(d.clienteId); if (convs.indexOf(d.clienteId) < (qtd.conversas || 0)) out[col][id] = d; continue; }
      usados[c] = (usados[c] || 0) + 1;
      if (usados[c] <= (qtd[c] || 0)) out[col][id] = d;
    }
  }
  return out;
}

async function emLotes(tarefas, tam = 8) {
  for (let i = 0; i < tarefas.length; i += tam) await Promise.all(tarefas.slice(i, i + tam).map(f => f()));
}
async function carregarExemplos() {
  if (!canWrite) { toast('Modo leitura: não dá para criar exemplos.'); return; }
  ui.exBusy = true; render();
  const tudo = montarExemplos();
  const data = ui.exQtd ? filtrarExemplos(tudo, ui.exQtd) : tudo;
  const tarefas = [];
  for (const [col, docs] of Object.entries(data)) for (const [id, body] of Object.entries(docs)) tarefas.push(() => put(col, id, body));
  if (!tarefas.length) { ui.exBusy = false; render(); toast('Escolha ao menos um exemplo.'); return; }
  const ok = await safe(() => emLotes(tarefas));

  ui.exBusy = false; ui.sheet = null; render();
  if (ok && backend === 'local') ls.set(AUTO_EX_KEY, { manual: true, dia: dayKey(Date.now()) });
  if (ok) toast(`Exemplos carregados: ${tarefas.length} registros.`);
}
async function removerExemplos() {
  if (!canWrite) { toast('Modo leitura: não dá para apagar.'); return; }
  ui.exBusy = true; render();
  const tarefas = [];
  for (const c of COLS) for (const d of S[c]) if (ehExemplo(c, d)) tarefas.push(() => del(c, d.id));

const prodById = id => S.produtos.find(p => p.id === id);

/* estornos: ficam guardados dentro do lançamento original (vendas, compras ou despesas), nunca apagam nada.
   caixa=true: o dinheiro voltou de verdade (saída no caixa para venda, entrada para compra/despesa).
   caixa=false: o lançamento ainda não tinha sido pago, então o estorno só abate do que falta receber/pagar. */
const estornos = x => Array.isArray(x?.estornos) ? x.estornos : [];
const somaE = (x, f = () => true) => n2(estornos(x).filter(f).reduce((s, e) => s + (Number(e.valor) || 0), 0));
const estTot = x => somaE(x);
const abatido = x => somaE(x, e => e.caixa === false);
const valOrig = (col, x) => col === 'despesas' ? (Number(x.valor) || 0) : (Number(x.total) || 0);
const restante = (col, x) => Math.max(0, n2(valOrig(col, x) - estTot(x)));
const vLiq = v => restante('vendas', v);
const cAberto = c => restante('compras', c);
const estQtd = (x, pid, soEstoque) => estornos(x).filter(e => !soEstoque || e.estoque).reduce((s, e) => s + (e.itens || []).filter(i => i.produtoId === pid).reduce((a, i) => a + (Number(i.qtd) || 0), 0), 0);
const estPill = (col, x) => { const t = estTot(x); if (!t) return ''; return t >= valOrig(col, x) - 0.005 ? '<span class="pill p-gray">Estornada</span>' : `<span class="pill p-no">Estorno ${money(t)}</span>`; };
const origTxt = v => v.origem === 'app' ? ' · pelo app' : v.origem === 'chat' ? ' · pelo chat' : '';
function cashMoves(periodo) {
  const m = [];
  const est = (col, x, nome) => { for (const e of estornos(x)) if (e.caixa !== false) m.push({ ts: e.ts, tipo: col === 'vendas' ? 'out' : 'in', k: 'estornos', desc: 'Estorno · ' + nome, det: (e.parcial ? 'Parcial' : 'Total') + (e.motivo ? ' · ' + e.motivo : ''), forma: e.forma || '', valor: Number(e.valor) || 0, col, id: x.id, eid: e.id }); };
  for (const v of S.vendas) {
    const nome = v.cliente?.nome || 'Cliente avulso';
    if (v.pago && (v.status !== 'cancelado' || estornos(v).length)) m.push({ ts: v.pagoTs || v.ts, tipo: 'in', k: 'vendas', desc: 'Venda · ' + nome, det: (FORMAS[v.forma] || v.forma || '') + origTxt(v), forma: v.forma, valor: n2((v.total || 0) - abatido(v)), col: 'vendas', id: v.id });
    est('vendas', v, nome);
  }
  for (const c of S.compras) {
    if (c.pago) m.push({ ts: c.pagoTs || c.ts, tipo: 'out', k: 'compras', desc: 'Compra · ' + (c.fornecedor || 'Roça'), det: itemsText(c.itens), forma: c.forma, valor: n2((c.total || 0) - abatido(c)), col: 'compras', id: c.id });
    est('compras', c, c.fornecedor || 'Roça');
  }
  for (const d of S.despesas) {
    m.push({ ts: d.ts, tipo: 'out', k: 'despesas', desc: d.descricao || 'Despesa', det: CATS[d.categoria] || 'Despesa', forma: d.forma || '', valor: Number(d.valor) || 0, col: 'despesas', id: d.id });
    est('despesas', d, d.descricao || 'Despesa');
  }
  return m.filter(x => inPeriod(x.ts, periodo)).sort((a, b) => b.ts - a.ts);
}
function totals(periodo) {
  const vs = vendasValidas().filter(v => inPeriod(v.ts, periodo));
  const vendas = vs.reduce((s, v) => s + vLiq(v), 0);
  const cmv = vs.reduce((s, v) => s + (v.itens || []).reduce((a, i) => a + Math.max(0, i.qtd - estQtd(v, i.produtoId, true)) * (i.custo || 0), 0), 0);
  const compras = S.compras.filter(c => inPeriod(c.ts, periodo)).reduce((s, c) => s + cAberto(c), 0);
  const despesas = S.despesas.filter(d => inPeriod(d.ts, periodo)).reduce((s, d) => s + restante('despesas', d), 0);
  const moves = cashMoves(periodo);
  const entradas = moves.filter(m => m.tipo === 'in').reduce((s, m) => s + m.valor, 0);
  const saidas = moves.filter(m => m.tipo === 'out').reduce((s, m) => s + m.valor, 0);
  return { vs, vendas, cmv, compras, despesas, entradas, saidas, lucroBruto: vendas - cmv, resultado: vendas - cmv - despesas };
}
const aReceber = () => vendasValidas().filter(v => !v.pago && vLiq(v) > 0);
const aPagar = () => S.compras.filter(c => !c.pago && cAberto(c) > 0);
const saldoGeral = () => cashMoves('tudo').reduce((s, m) => s + (m.tipo === 'in' ? m.valor : -m.valor), 0);

const NOTIF_TIPOS = {

function notificacoes(todas) {

    if (v.clienteInformouPix && !v.pago) add('pix:' + v.id, 'pix', v.ts + 6e4, `${nomeV(v)} diz que pagou no Pix`, `Confira no banco se caiu ${money(v.total)} e confirme o pagamento.`, 'go-vendas-receber');

}

/* ---------------- render ---------------- */
let rq = false;
function scheduleRender() { if (!rq) { rq = true; requestAnimationFrame(() => { rq = false; render(); }); } }
const $main = document.getElementById('main');
function renderStatus() { scheduleRender(); }
function statusNote() {
  let msg = '';
  if (loadSlow) msg = 'Os dados ainda não chegaram. A tela atualiza sozinha quando chegarem.';
  else if (!canWrite) msg = 'Modo leitura: só o dono e editores podem alterar os dados.';
  return msg ? `<div class="note" role="status">${esc(msg)}</div>` : '';
}
/* períodos: toda página abre em "Hoje". Ao sair de uma página, o período dela volta para Hoje
   (atalhos que já abrem a página com outro período, como "A receber", continuam valendo). */
const PER_PAG = { vendas: ['vp', 'vDe', 'vAte'], caixa: ['cp', 'cDe', 'cAte'], entregas: ['ep', 'eDe', 'eAte'], compras: ['kp', 'kDe', 'kAte'], relatorios: ['rp', 'rDe', 'rAte'] };
let pagAnterior = null;
function periodoNaTroca() {
  const atual = ui.mode === 'gestao' ? 'g:' + ui.g : 'c:' + ui.c;
  if (pagAnterior && pagAnterior !== atual) { const ks = PER_PAG[pagAnterior.slice(2)]; if (pagAnterior[0] === 'g' && ks) { ui[ks[0]] = 'hoje'; if (ks[1]) { ui[ks[1]] = ''; ui[ks[2]] = ''; } } }
  pagAnterior = atual;
}
function render() {
  periodoNaTroca();
  if (backend === 'pending') { $main.innerHTML = '<div class="empty" style="padding-top:120px">Carregando…</div>'; return; }
  ensureTeste();
  const keep = {}; $main.querySelectorAll('input[id],select[id],textarea[id]').forEach(el => { keep[el.id] = el.type === 'radio' || el.type === 'checkbox' ? el.checked : el.value; });
  const focused = document.activeElement && $main.contains(document.activeElement) ? document.activeElement.id : null;
  $main.innerHTML = ui.mode === 'gestao' ? gestao() : cliente();
  for (const [k, val] of Object.entries(keep)) { const el = document.getElementById(k); if (!el || !$main.contains(el)) continue; if (el.type === 'radio' || el.type === 'checkbox') el.checked = val; else el.value = val; }
  if (focused) document.getElementById(focused)?.focus({ preventScroll: true });
  document.getElementById('nav-root').innerHTML = nav();
  document.getElementById('sheet-root').innerHTML = ui.sheet ? sheetHTML() : '';
  chatAfterRender();
  newsAfterRender();
  navSync();
  cabecalhoFixo();
}
/* cabeçalho fixo: sombra ao rolar e espaço para rolagens automáticas não pararem atrás dele */
function cabecalhoFixo() {
  const h = $main.querySelector(':scope > :is(.lt-top, .lt-head, .lt-headbox)');
  document.documentElement.style.scrollPaddingTop = h ? (h.offsetHeight + 8) + 'px' : '';
  document.body.classList.toggle('rolou', window.scrollY > 4);
}
addEventListener('scroll', () => document.body.classList.toggle('rolou', window.scrollY > 4), { passive: true });
addEventListener('resize', () => cabecalhoFixo());

  if (ui.mode === 'gestao') ui.g = page; else ui.c = page;

}

function bandGestao() {
  const t = totals('hoje');
  const rec = aReceber().reduce((s, v) => s + vLiq(v), 0);
  /* de hoje: o que já entrou e o que ainda falta receber; "A receber" e "Saldo em caixa" são acumulados (todos os dias) */
  const faltaHoje = t.vs.filter(v => !v.pago).reduce((s, v) => s + vLiq(v), 0);
  const recebidoHoje = Math.max(0, t.vendas - faltaHoje);
  const est = S.produtos.reduce((s, p) => s + (p.estoque || 0), 0);
  return `<section class="lt-hero" aria-label="Vendas de hoje">
    <div class="lt-hero-head"><span>Vendas de hoje</span><span class="lt-pill-on">${t.vs.length} ${t.vs.length === 1 ? 'pedido' : 'pedidos'}</span></div>

/* ===== GESTÃO ===== */
function gestao() {
  return ({ inicio: gInicio, vendas: gVendas, entregas: gEntregas, compras: gCompras, caixa: gCaixa, estoque: gEstoque, noticias: gNoticias, relatorios: gRelatorios, atividade: gAtividade, clientes: gClientes, conversas: gConversas, config: gConfig, notificacoes: gNotificacoes, pendencias: gPendencias }[ui.g] || gInicio)();
}
function pendencias() {
  const p = []; // [grupo, icone, titulo, detalhe, quantidade, ação, v, tom]
  const nl = naoLidasG(), cn = conversasNaoLidas();
  if (nl) p.push(['Responder', 'chat', 'Mensagens sem responder', cn.map(c => c.nome).slice(0, 2).join(', '), nl, 'go-conversas', '', 'red']);
  const novos = S.vendas.filter(v => v.status === 'recebido');
  if (novos.length) p.push(['Responder', 'receipt', 'Pedidos novos para separar', novos.map(v => v.cliente?.nome).filter(Boolean).slice(0, 2).join(', '), novos.length, 'go-vendas-abertas', '', 'red']);
  const pix = S.vendas.filter(v => v.clienteInformouPix && !v.pago && v.status !== 'cancelado');
  if (pix.length) p.push(['Receber', 'cash', 'Pix para confirmar', pix.map(v => v.cliente?.nome).filter(Boolean).slice(0, 2).join(', '), pix.length, 'go-vendas-receber', '', 'warn']);
  const rec = aReceber();

/* estorno total ou parcial: devolve o valor (sai do caixa na venda, volta na compra/despesa), guarda o motivo,

const MOTIVOS = {

function modalEstorno(col, id, opts = {}) {

  const pago = col === 'despesas' ? true : !!x.pago;
  const campo = col === 'compras' ? 'custo' : 'preco';
  const itens = col === 'despesas' ? [] : (x.itens || []).map(i => ({ produtoId: i.produtoId, nome: i.nome, unit: Number(i[campo]) || 0, max: n2(i.qtd - estQtd(x, i.produtoId)) })).filter(i => i.max > 0);
  const nome = col === 'vendas' ? (x.cliente?.nome || 'cliente avulso') : col === 'compras' ? (x.fornecedor || 'roça') : (x.descricao || 'despesa');
  const formas = ['pix', 'dinheiro', 'debito', 'credito']; if (x.forma && x.forma !== 'fiado' && !formas.includes(x.forma)) formas.push(x.forma);
  const forma0 = x.forma && x.forma !== 'fiado' && x.forma !== 'cartao_entrega' ? x.forma : 'pix';

function newsCTA(id) {
  const n = S.noticias.find(x => x.id === id); if (!n) return;
  if (canWrite) patch('noticias', id, { cliques: (n.cliques || 0) + 1 }).catch(() => {});

  if (n.acao === 'comprar') {
    const p = prodById(n.acaoProd);
    if (p && p.ativo !== false && (p.estoque || 0) > 0) { if (!ui.cart[p.id]) ui.cart[p.id] = 1; go('sacola'); toast(`${p.nome} está na sua sacola.`); }
    else { toast('Esse produto acabou. Veja os outros morangos.'); irLoja(); }
  } else if (n.acao === 'loja') irLoja();
  else if (n.acao === 'chat') go('chat');
  else if (n.acao === 'pedido') go('pedidos');
}

function cPedidos() {
  const mine = meusPedidos().sort((a, b) => b.ts - a.ts);
  if (!mine.length) return pageHeader('Meus pedidos') + emptyBox('Você ainda não fez pedidos por aqui.', '<button class="btn primary" data-act="go" data-v="inicio">Comprar morangos</button>');
  const r = rota();
  const ord = activeOrder();
  const ETAPAS = ['recebido', 'separado', 'em_rota', 'entregue'];
  const falta = v => { const pos = r.findIndex(x => x.id === v.id); return v.status === 'em_rota' && pos >= 0 ? pos : -1; };
  const statusTxt = v => { const pos = falta(v);
    if (pos >= 0) return `${pos === 0 ? 'Você é a próxima entrega!' : `Faltam ${pos} ${pos === 1 ? 'entrega' : 'entregas'} antes da sua`} · cerca de ${(pos + 1) * MIN_PER_STOP} min`;
    return { recebido: 'Recebemos seu pedido. Já vamos separar.', separado: 'Separado. Entra na próxima rota.', em_rota: 'Seu pedido está a caminho.', entregue: 'Entregue. Bom proveito!', cancelado: 'Este pedido foi cancelado.' }[v.status] || ''; };
  const pagoP = v => v.pago ? '<span class="pill p-ok">Pago</span>' : v.clienteInformouPix ? '<span class="pill p-blue">Aguardando confirmação</span>' : v.status === 'cancelado' ? '' : '<span class="pill p-no">Pagar ' + (v.forma === 'pix' ? 'via Pix' : 'na entrega') + '</span>';
  let topo = '';
  if (ord) {
    const idx = ETAPAS.indexOf(ord.status), pos = falta(ord);
    const big = pos >= 0 ? (pos === 0 ? 'Você é a próxima entrega!' : `Faltam ${pos} ${pos === 1 ? 'entrega' : 'entregas'} antes da sua`) : orderSub(ord);
    const sub = pos >= 0 ? `Chega em cerca de ${(pos + 1) * MIN_PER_STOP} minutos` : `Pedido de ${fmtDT(ord.ts)} · ${esc(itemsText(ord.itens))}`;
    topo = `<section class="item c-track ${pos >= 0 ? 'now' : ''}" aria-label="Acompanhar entrega">
      <div class="tc-l1"><b class="tc-t">Acompanhe a entrega</b><span class="val">${money(ord.total)}</span></div>
      <div class="steps">${[0, 1, 2, 3].map(i => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div><div class="steps-l">${['Recebido', 'Separado', 'A caminho', 'Entregue'].map((l, i) => `<span class="${i <= idx ? 'on' : ''}">${l}</span>`).join('')}</div>
      <div class="c-track-tx"><b>${esc(big)}</b><small>${sub}</small></div>
      ${pos >= 0 ? routeMap(r.length, pos) : ''}
    </section>`;
  }
  return pageHeader('Meus pedidos') + topo +
  `<div class="sec-h"><h2>Todos os pedidos</h2><span class="muted num">${mine.length}</span></div>
  <div class="stack">${mine.map(v => {
    const pix = v.forma === 'pix' && !v.pago && v.status !== 'cancelado' && !v.clienteInformouPix;
    const val = n2(v.total).toFixed(2);
    return ccard({ cls: v.status === 'em_rota' ? 'now' : '', title: `Pedido de ${fmtDT(v.ts)}`, val: money(v.total),

  let d = `M${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const mx = (x0 + x1) / 2; d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }

const emAberto = cid => { const ms = msgsDe(cid); const l = ms[ms.length - 1]; return !!l && l.de === 'cliente'; };
const dataWA = ts => { const d0 = startOfDay(); return ts >= d0 ? hhmm(ts) : ts >= d0 - 864e5 ? 'Ontem' : new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
function gConversas() {
  if (ui.conv) return gConversa(ui.conv);

  `<div class="wa-chips" role="group" aria-label="Filtrar chats">${chip('todas', 'Todas')}${chip('naolidas', 'Não lidas', tot)}${chip('aberto', 'Em aberto', nAb)}</div>
  ${list.length ? `<div class="wa-list">${list.map(x => { const eu = x.last.de === 'gestao'; const visto = eu && x.last.lidaCliente;

      <span class="conv-bot"><span class="conv-last ${x.nl ? 'nl' : ''}">${eu ? `<span class="conv-tick ${visto ? 'lido' : ''}" aria-label="${visto ? 'Visualizada' : 'Entregue'}">✓✓</span> ` : ''}${esc(prevMsg(x.last))}</span>${x.nl ? `<span class="conv-nl" aria-label="${x.nl} não lidas">${x.nl}</span>` : x.ab ? '<span class="conv-ab">Em aberto</span>' : ''}</span></span></button>`; }).join('')}</div>`

function gConversa(cid) {

/* ---------------- calendário (usado em todo o app) ---------------- */
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const dataBR = x => x ? x.split('-').reverse().join('/') : 'Escolher data';
const dateField = (id, name, val, title) => `<input type="hidden" id="${id}" name="${name}" value="${val}"><button type="button" class="date-btn" id="${id}-b" data-cal-field="${id}" data-cal-title="${esc(title)}">${ic('calendar')}<span>${dataBR(val)}</span></button>`;
const CAL = { open: false };
const $cal = document.createElement('div'); $cal.id = 'cal-root'; document.body.appendChild($cal);
function calOpen(o) {
  const base = o.value ? new Date(o.value + 'T12:00') : new Date();
  Object.assign(CAL, { open: true, title: o.title || 'Escolher data', sel: o.value || '', min: o.min || '', max: o.max || '', onOk: o.onOk, y: base.getFullYear(), m: base.getMonth(), view: 'dias' });
  calRender();
  setTimeout(() => $cal.querySelector('.cal-d[aria-pressed="true"], .cal-d.hoje, .cal-d')?.focus({ preventScroll: true }), 30);
}
function calClose() { CAL.open = false; $cal.innerHTML = ''; }
function calRender() {
  if (!CAL.open) { $cal.innerHTML = ''; return; }
  const { y, m } = CAL, hoje = ymd(new Date());
  let body;
  if (CAL.view === 'meses') {
    body = `<div class="cal-ms">${MESES.map((n, i) => `<button class="cal-m" data-cal="mes" data-m="${i}" aria-pressed="${i === m}">${n.slice(0, 3)}</button>`).join('')}</div>`;
  } else {
    const first = new Date(y, m, 1), off = first.getDay(), dias = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((off + dias) / 7), cells = [];
    for (let i = 0; i < rows * 7; i++) {
      const d = new Date(y, m, 1 + i - off), k = ymd(d), out = d.getMonth() !== m;
      const dis = (CAL.min && k < CAL.min) || (CAL.max && k > CAL.max);
      cells.push(`<button class="cal-d ${out ? 'out' : ''} ${k === hoje ? 'hoje' : ''}" data-cal="dia" data-d="${k}" aria-pressed="${k === CAL.sel}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}" ${dis ? 'disabled' : ''}>${d.getDate()}</button>`);
    }
    body = `<div class="cal-grid">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(w => `<span class="cal-wd">${w}</span>`).join('')}${cells.join('')}</div>`;
  }
  const lbl = CAL.view === 'meses' ? `${y}` : `${MESES[m]} ${y}`;
  $cal.innerHTML = `<div class="sheet bs-scrim cal-scrim" data-cal="fora"><div class="bs cal" role="dialog" aria-modal="true" aria-label="${esc(CAL.title)}">
    <h2 class="cal-t">${esc(CAL.title)}</h2>
    <div class="cal-nav"><button data-cal="ant" aria-label="${CAL.view === 'meses' ? 'Ano anterior' : 'Mês anterior'}">${ic('left')}</button><button class="cal-mes" data-cal="vista" aria-label="${CAL.view === 'meses' ? 'Voltar aos dias' : 'Escolher mês e ano'}">${lbl}${ic('down')}</button><button data-cal="prox" aria-label="${CAL.view === 'meses' ? 'Próximo ano' : 'Próximo mês'}">${ic('right')}</button></div>
    ${body}
    <button class="cal-ok" data-cal="ok" ${CAL.sel ? '' : 'disabled'}>Confirmar</button>
  </div></div>`;
}
$cal.addEventListener('click', e => {
  const t = e.target.closest('[data-cal]'); if (!t || t.disabled) return;
  const a = t.dataset.cal;
  if (a === 'fora') { if (e.target === t) calClose(); return; }
  if (a === 'ant' || a === 'prox') { const s = a === 'ant' ? -1 : 1; if (CAL.view === 'meses') CAL.y += s; else { const d = new Date(CAL.y, CAL.m + s, 1); CAL.y = d.getFullYear(); CAL.m = d.getMonth(); } }
  else if (a === 'vista') CAL.view = CAL.view === 'meses' ? 'dias' : 'meses';
  else if (a === 'mes') { CAL.m = Number(t.dataset.m); CAL.view = 'dias'; }
  else if (a === 'dia') { CAL.sel = t.dataset.d; const d = new Date(CAL.sel + 'T12:00'); CAL.y = d.getFullYear(); CAL.m = d.getMonth(); }
  else if (a === 'ok') { const v = CAL.sel, fn = CAL.onOk; calClose(); fn && fn(v); return; }
  calRender();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cal-field]'); if (!b) return;
  const inp = document.getElementById(b.dataset.calField); if (!inp) return;
  calOpen({ title: b.dataset.calTitle, value: inp.value, min: inp.dataset.min, max: inp.dataset.max, onOk: v => { inp.value = v; b.querySelector('span').textContent = dataBR(v); inp.dispatchEvent(new Event('change', { bubbles: true })); b.focus(); } });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && CAL.open) { e.stopImmediatePropagation(); calClose(); } }, true);

/* ---------------- modais da gestão ---------------- */
const $modal = document.getElementById('modal-root');
function openModal(title, inner, onSubmit, onOpen) {
  $modal.innerHTML = `<div class="overlay bs-scrim" data-act="close-modal"><div class="bs" role="dialog" aria-modal="true" aria-labelledby="mtitle" data-stop="1"><div class="bs-h"><h2 id="mtitle">${title}</h2><button type="button" class="bs-x" data-act="close-modal" aria-label="Fechar">${ic('x')}</button></div><form id="mform" novalidate>${inner}</form></div></div>`;
  document.getElementById('nav-root').innerHTML = nav();
  const f = document.getElementById('mform');
  f.addEventListener('submit', async e => { e.preventDefault(); const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true; const ok = await onSubmit(f); if (btn) btn.disabled = false; if (ok !== false) closeModal(); });
  onOpen && onOpen(f);
  setTimeout(() => f.querySelector('input,select')?.focus(), 30);
}
function closeModal() { $modal.innerHTML = ''; document.getElementById('nav-root').innerHTML = nav(); }
const todayInput = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const tsFromDate = s => { if (!s || s === todayInput()) return Date.now(); const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12).getTime(); };
const prodOptions = sel => sortedProdutos().map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');

function linesEditor(kind) {
  return `<div class="f full"><span class="lbl">Itens</span>
    <div class="lines"><div class="line line-h"><span>Produto</span><span>Qtd.</span><span>${kind === 'compra' ? 'Custo un.' : 'Preço un.'}</span><span></span></div><div id="lines"></div></div>
    <button type="button" class="btn small" data-add-line style="justify-self:start;margin-top:4px">+ Item</button></div>
    <div class="total-row f full"><span class="muted">Total</span><b class="num" id="ltotal">R$ 0,00</b></div>`;
}
function wireLines(f, kind, init) {
  const box = f.querySelector('#lines');
  let k = 0;
  const priceOf = id => { const p = prodById(id); return p ? (kind === 'compra' ? p.custo : p.preco) || 0 : 0; };
  const add = it => {
    const pid = it?.produtoId || sortedProdutos()[0]?.id || '';
    const i = k++;
    const extra = it && !prodById(pid) ? `<option value="${esc(pid)}" selected>${esc(it.nome || 'Produto removido')}</option>` : '';
    const row = document.createElement('div'); row.className = 'line';
    row.innerHTML = `<select aria-label="Produto" id="l-p-${i}" name="p">${extra}${prodOptions(pid)}</select><input aria-label="Quantidade" id="l-q-${i}" name="q" type="number" min="0" step="any" value="${it ? it.qtd : 1}" inputmode="decimal"><input aria-label="Valor unitário" id="l-v-${i}" name="v" type="number" min="0" step="0.01" value="${it ? (kind === 'compra' ? it.custo : it.preco) ?? priceOf(pid) : priceOf(pid)}" inputmode="decimal"><button type="button" class="x" aria-label="Remover item">×</button>`;
    row.querySelector('select').addEventListener('change', e => { row.querySelector('[name=v]').value = priceOf(e.target.value); calc(); });
    row.querySelector('.x').addEventListener('click', () => { row.remove(); calc(); });
    box.appendChild(row); calc();
  };
  const calc = () => { f.querySelector('#ltotal').textContent = money(readLines(f).reduce((s, l) => s + l.qtd * l.unit, 0)); };
  box.addEventListener('input', calc);
  f.querySelector('[data-add-line]').addEventListener('click', () => add());
  if (init && init.length) init.forEach(add); else add();
}
function readLines(f) {
  return [...f.querySelectorAll('#lines .line')].map(r => ({ produtoId: r.querySelector('[name=p]').value, qtd: Number(r.querySelector('[name=q]').value) || 0, unit: Number(r.querySelector('[name=v]').value) || 0 })).filter(l => l.produtoId && l.qtd > 0);
}
const formaOpts = (name, list, sel) => `<div class="opts">${list.map(k => `<label class="opt"><input type="radio" name="${name}" value="${k}" id="${name}-${k}" ${k === sel ? 'checked' : ''}><span>${FORMAS[k]}</span></label>`).join('')}</div>`;

async function adjustStock(itens, sign) {
  // soma (sign=+1) ou desconta (sign=-1) do estoque, um produto por vez
  const by = {}; for (const i of itens) by[i.produtoId] = (by[i.produtoId] || 0) + i.qtd;
  for (const [id, q] of Object.entries(by)) { const p = prodById(id); if (p && q) await patch('produtos', id, { estoque: n2((p.estoque || 0) + sign * q) }); }
}

function modalVenda(cliId, editId, titulo) {
  const ed = editId ? S.vendas.find(x => x.id === editId) : null;
  if (editId && !ed) return;
  if (!ed && !S.produtos.length) { toast('Cadastre um produto na aba Estoque primeiro.'); return; }
  const cli = cliId ? S.clientes.find(x => x.id === cliId) : null;
  const c0 = ed ? (ed.cliente || {}) : { nome: cli?.nome || '', telefone: cli?.telefone || '', endereco: cliEndereco(cli) };
  const formas = ['pix', 'dinheiro', 'debito', 'credito', 'fiado']; if (ed && ed.forma && !formas.includes(ed.forma)) formas.push(ed.forma);

    : `<select id="v-ent" name="entrega"><option value="entregue">Já entregue / retirado</option><option value="separado">Entregar depois</option><option value="em_rota">Pôr na rota agora</option></select>`;
  openModal(ed ? (titulo || 'Editar venda') : 'Venda avulsa', `<div class="fgrid">
    <div class="f"><label for="v-nome">Cliente</label><input type="text" id="v-nome" name="nome" placeholder="Opcional" list="cli-list" autocomplete="off" value="${esc(c0.nome || '')}"><datalist id="cli-list">${sortedClientes().map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div>
    <div class="f"><label for="v-tel">Telefone</label><input type="tel" id="v-tel" name="telefone" placeholder="Opcional" value="${esc(c0.telefone || '')}"></div>

    <div class="f full"><span class="lbl">Forma de pagamento</span>${formaOpts('forma', formas, ed ? ed.forma : 'pix')}</div>
    <div class="f"><label class="switch" for="v-pago"><input type="checkbox" id="v-pago" name="pago" ${!ed || ed.pago ? 'checked' : ''}> Já foi pago</label></div>
    <div class="f"><label for="v-ent">Entrega</label>${entregaSel}</div>
    <div class="f"><label for="v-data-b">Data</label>${dateField('v-data', 'data', dataOrig, 'Data da venda')}</div>
    <div class="f"><label for="v-obs">Observação</label><input type="text" id="v-obs" name="obs" value="${esc(ed?.obs || '')}"></div>
  </div>${ed && estornos(ed).length ? `<p class="cx-note" style="margin-top:10px">Esta venda tem ${estornos(ed).length === 1 ? 'um estorno' : estornos(ed).length + ' estornos'} (${money(estTot(ed))}). <button type="button" class="link" data-act="cx-det" data-col="vendas" data-id="${ed.id}" style="font-size:inherit;padding:0">Ver detalhes</button></p>` : ''}<div class="form-acts">${ed && !cancelada ? `<button type="button" class="btn ghost" data-act="cancelar" data-id="${ed.id}">Cancelar venda</button>` : ''}${ed && !cancelada && vLiq(ed) > 0 ? `<button type="button" class="btn ghost" data-act="estornar" data-col="vendas" data-id="${ed.id}" style="margin-right:auto">Estornar</button>` : ''}<button type="button" class="btn" data-act="close-modal">${ed ? 'Fechar' : 'Cancelar'}</button><button type="submit" class="btn primary">${ed ? 'Salvar alterações' : 'Salvar venda'}</button></div>`,
  async f => {
    const lines = readLines(f); if (!lines.length) { toast('Adicione pelo menos um item.'); return false; }
    const fd = new FormData(f);
    const velho = id => (ed?.itens || []).find(i => i.produtoId === id);
    const itens = lines.map(l => { const p = prodById(l.produtoId), o = velho(l.produtoId); return { produtoId: l.produtoId, nome: p?.nome || o?.nome || '', qtd: l.qtd, preco: l.unit, custo: o?.custo ?? p?.custo ?? 0 }; });
    const pago = !!fd.get('pago');
    const status = fd.get('entrega');
    const cliente = { nome: String(fd.get('nome') || '').trim(), telefone: String(fd.get('telefone') || '').trim(), endereco: String(fd.get('endereco') || '').trim() };
    const cl = S.clientes.find(x => (x.nome || '').trim().toLowerCase() === cliente.nome.toLowerCase());
    const total = n2(itens.reduce((s, i) => s + i.qtd * i.preco, 0));
    if (ed) {
      const ts = fd.get('data') === dataOrig ? ed.ts : tsFromDate(fd.get('data'));
      const body = { ts, cliente, itens, total, forma: fd.get('forma'), pago, pagoTs: pago ? (ed.pago ? ed.pagoTs || ts : Date.now()) : null, status, obs: String(fd.get('obs') || '').trim() };
      if (!pago) body.clienteInformouPix = false;
      if (cl) body.clienteId = cl.id;

    if (cl) body.clienteId = cl.id;
    return safe(async () => { await put('vendas', uid(), body); await adjustStock(itens, -1); }, 'Venda salva.');
  }, f => {

  const dataOrig = ed ? ymd(new Date(ed.ts)) : todayInput();
  openModal(ed ? 'Editar compra' : 'Compra na roça', `<div class="fgrid">
    <div class="f full"><label for="c-forn">Produtor / roça</label><input type="text" id="c-forn" name="fornecedor" placeholder="Ex.: Sítio do Seu João" list="forn-list" autocomplete="off" value="${esc(ed ? ed.fornecedor || '' : fo?.nome || '')}"><datalist id="forn-list">${[...new Set([...sortedFornecedores().map(c => c.nome), ...S.compras.map(c => c.fornecedor)].filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    ${linesEditor('compra')}
    <div class="f full"><span class="lbl">Pagamento</span>${formaOpts('forma', formas, ed ? ed.forma : 'pix')}</div>
    <div class="f"><label class="switch" for="c-pago"><input type="checkbox" id="c-pago" name="pago" ${!ed || ed.pago ? 'checked' : ''}> Já foi pago</label></div>
    <div class="f"><label for="c-data-b">Data</label>${dateField('c-data', 'data', dataOrig, 'Data da compra')}</div>
    <div class="f full"><label class="switch" for="c-custo"><input type="checkbox" id="c-custo" name="custo" ${ed ? '' : 'checked'}> Atualizar o custo dos produtos com este valor</label></div>
    <div class="f full"><label for="c-obs">Observação</label><input type="text" id="c-obs" name="obs" value="${esc(ed?.obs || '')}"></div>
  </div><div class="form-acts">${ed ? `<button type="button" class="btn ghost" data-act="apagar-compra" data-id="${ed.id}" style="margin-right:auto">Apagar compra</button>` : ''}<button type="button" class="btn" data-act="close-modal">${ed ? 'Fechar' : 'Cancelar'}</button><button type="submit" class="btn primary">${ed ? 'Salvar alterações' : 'Salvar compra'}</button></div>`,
  async f => {
    const fd = new FormData(f);
    if (!String(fd.get('fornecedor') || '').trim()) { toast('Diga de quem você comprou.'); return false; }
    const lines = readLines(f); if (!lines.length) { toast('Adicione pelo menos um item.'); return false; }
    const itens = lines.map(l => ({ produtoId: l.produtoId, nome: prodById(l.produtoId)?.nome || (ed?.itens || []).find(i => i.produtoId === l.produtoId)?.nome || '', qtd: l.qtd, custo: l.unit }));
    const fn = String(fd.get('fornecedor')).trim(); const fc = S.fornecedores.find(x => norm(x.nome) === norm(fn));
    const ts = ed && fd.get('data') === dataOrig ? ed.ts : tsFromDate(fd.get('data'));
    const body = { ts, fornecedor: fn, ...(fc ? { fornecedorId: fc.id } : {}), itens, total: n2(itens.reduce((s, i) => s + i.qtd * i.custo, 0)), forma: fd.get('forma'), pago: !!fd.get('pago'), obs: String(fd.get('obs') || '').trim() };
    const upd = !!fd.get('custo');
    if (ed) {
      // estoque: tira o que a compra somou antes e soma o que ela soma agora, numa conta só
      const delta = [...itens, ...(ed.itens || []).map(i => ({ produtoId: i.produtoId, qtd: -i.qtd }))].filter(i => prodById(i.produtoId));
      return safe(async () => {
        await patch('compras', ed.id, body);
        await adjustStock(delta, 1);
        if (upd) for (const i of itens) if (prodById(i.produtoId)) await patch('produtos', i.produtoId, { custo: i.custo });
      }, 'Compra atualizada e estoque corrigido.');
    }
    return safe(async () => {
      await put('compras', uid(), body);
      for (const i of itens) { const p = prodById(i.produtoId); if (p) await patch('produtos', p.id, upd ? { estoque: n2((p.estoque || 0) + i.qtd), custo: i.custo } : { estoque: n2((p.estoque || 0) + i.qtd) }); }
    }, 'Compra salva e estoque atualizado.');
  }, f => { wireLines(f, 'compra', ed?.itens); f.addEventListener('change', e => { if (e.target.name === 'forma') f.querySelector('#c-pago').checked = e.target.value !== 'fiado'; }); });
}

  </div><div class="form-acts"><button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>`,
  async f => { const fd = new FormData(f); const q = Number(fd.get('qtd')); if (!(q >= 0) || fd.get('qtd') === '') { toast('Informe a quantidade.'); return false; }

}

async function setStatus(id, st) {
  const v = S.vendas.find(x => x.id === id); if (!v) return;
  const body = { status: st };
  if (st === 'em_rota') body.ordemRota = nextOrdem();
  if (st === 'entregue' && v.status === 'em_rota') body.entregueTs = Date.now();
  await safe(() => patch('vendas', id, body), st === 'entregue' ? 'Marcado como entregue.' : 'Pedido atualizado: ' + STATUS[st] + '.');
}
async function move(id, dir) {
  const r = rota(); const i = r.findIndex(v => v.id === id); const j = i + dir; if (i < 0 || j < 0 || j >= r.length) return;
  // renumera a rota inteira para evitar empates
  const order = r.map(v => v.id); [order[i], order[j]] = [order[j], order[i]];
  await safe(async () => { for (let k = 0; k < order.length; k++) { const v = r.find(x => x.id === order[k]); if (v.ordemRota !== k + 1) await patch('vendas', v.id, { ordemRota: k + 1 }); } });
}

async function checkout(f) {
  const fd = new FormData(f);
  const nome = String(fd.get('nome') || '').trim(), endereco = String(fd.get('endereco') || '').trim();
  if (!nome || !endereco) { toast('Preencha seu nome e o endereço de entrega.'); return; }
  const items = Object.entries(ui.cart).filter(([id, q]) => q > 0 && prodById(id));
  if (!items.length) return;
  for (const [id, q] of items) { const p = prodById(id); if (q > (p.estoque || 0)) { toast(`Só temos ${fmtNum(p.estoque)} de ${p.nome}.`); return; } }
  const itens = items.map(([id, q]) => { const p = prodById(id); return { produtoId: id, nome: p.nome, qtd: q, preco: p.preco, custo: p.custo || 0 }; });
  const troco = Number(fd.get('troco')) || 0;
  const forma = fd.get('forma');
  const obs = [String(fd.get('obs') || '').trim(), forma === 'dinheiro' && troco ? 'Troco para ' + money(troco) : ''].filter(Boolean).join(' · ');
  const id = uid();
  const body = { ts: Date.now(), cliente: { nome, telefone: String(fd.get('telefone') || '').trim(), endereco }, itens, total: n2(itens.reduce((s, i) => s + i.qtd * i.preco, 0)), forma, pago: false, pagoTs: null, origem: 'app', status: 'recebido', ordemRota: null, obs };
  const meuCid = meuClienteId(); if (meuCid) body.clienteId = meuCid;
  const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  const ok = await safe(async () => { await put('vendas', id, body); await adjustStock(itens, -1); });
  btn.disabled = false;
  if (ok) {
    ls.set('mmr-cliente', { nome, telefone: body.cliente.telefone, endereco, ...(meuCid ? { clienteId: meuCid } : {}) });
    myOrders = [id, ...myOrders].slice(0, 30); ls.set('mmr-meus-pedidos', myOrders);
    ui.cart = {}; ui.sheet = { type: 'done', total: body.total, forma }; render();
  }
}

/* LivTask · troca de aparência (opcional). Só mexe em atributos e na cor da barra do celular.
   ltAparencia({tema:'verde', visual:'classico', escuro:false, solido:false})
   ltAparencia()            -> reaplica o que estava salvo neste aparelho
   Regras iguais às do app:
   - Aurora só existe no claro e em degradê (escuro e sólido são desligados);
   - Bento não tem cor sólida e não usa a cor do tema (tem paleta própria). */
(function(g){
var TEMAS=[["verde", "Verde", "#3FA182", "#123F34"], ["verde-claro", "Verde claro", "#8FE3B8", "#2E9A66"], ["azul-claro", "Azul claro", "#5BC8F5", "#0B7DB5"], ["azul-escuro", "Azul escuro", "#3D63C9", "#0F2459"], ["roxo", "Roxo", "#9B5DE5", "#47188A"], ["lilas", "Lilás", "#CDAEF2", "#7C59B8"], ["rosa", "Rosa", "#FF7396", "#D41F4D"], ["vinho", "Vinho", "#A63D58", "#4A1024"], ["vermelho", "Vermelho", "#F0524A", "#9B1515"], ["vermelho-claro", "Vermelho claro", "#FF9E97", "#D9443A"], ["laranja", "Laranja", "#FF9A4D", "#C24E0C"], ["laranja-claro", "Laranja claro", "#FFC59A", "#E57A30"], ["amarelo", "Amarelo", "#FFD95C", "#D18F00"], ["amarelo-escuro", "Amarelo escuro", "#E0A800", "#6E4A00"], ["nude", "Nude", "#F6E3D6", "#C9A089"], ["marrom", "Marrom", "#9C6B4A", "#45291B"], ["cinza-claro", "Cinza claro", "#D5D9DE", "#7C848E"], ["cinza-escuro", "Cinza escuro", "#6E747C", "#25282D"], ["preto", "Preto", "#4B4B50", "#000000"]]; /* [id, nome, amostra clara, amostra escura] */
var CHAVE='lt-aparencia';
function ler(){try{return JSON.parse(localStorage.getItem(CHAVE))||{};}catch(e){return {};}}
function gravar(o){try{localStorage.setItem(CHAVE,JSON.stringify(o));}catch(e){}}
g.LT_TEMAS=TEMAS;
g.ltAparencia=function(novo,alvo){
  var el=alvo||document.body,o=Object.assign({tema:'verde',visual:'classico',escuro:false,solido:false},ler(),novo||{});
  if(!TEMAS.some(function(t){return t[0]===o.tema;}))o.tema='verde';
  if(['classico','aurora','bento'].indexOf(o.visual)<0)o.visual='classico';
  var esc=o.escuro,sol=o.solido;
  if(o.visual==='aurora'){esc=false;sol=false;}
  if(o.visual==='bento')sol=false;
  el.classList.add('lt');
  el.setAttribute('data-tema',o.tema);el.setAttribute('data-visual',o.visual);
  el.setAttribute('data-escuro',esc?'1':'0');el.setAttribute('data-solido',sol?'1':'0');
  /* barra de status do celular acompanha o fundo */
  var m=document.querySelector('meta[name="theme-color"]');

  var cs=getComputedStyle(el);
  m.content=(o.visual==='aurora')?cs.getPropertyValue('--a2').trim():(cs.getPropertyValue('--g1').trim()||cs.getPropertyValue('--ground').trim());
  if(sol||o.visual==='bento'||esc)m.content=cs.getPropertyValue('--ground').trim();
  gravar(o);return o;
};
})(window);

    case 'apagar-fornecedor': modalConfirm('Apagar este fornecedor? As compras dele continuam no histórico.', 'Apagar fornecedor', () => safe(() => del('fornecedores', id), 'Fornecedor apagado.')); break;
    case 'venda-cliente': if (ui.sheet) { ui.sheet = null; render(); } if (!canWrite) { toast('Modo leitura: não dá para lançar.'); break; } modalVenda(id); break;
    case 'apagar-cliente': modalConfirm('Apagar este cliente? As vendas dele continuam no histórico.', 'Apagar cliente', () => safe(() => del('clientes', id), 'Cliente apagado.')); break;
    case 'close-modal': closeModal(); break;
    case 'pago': await safe(() => patch('vendas', id, v === '1' ? { pago: true, pagoTs: Date.now() } : { pago: false, pagoTs: null, clienteInformouPix: false }), v === '1' ? 'Marcado como pago.' : 'Marcado como não pago.'); break;
    case 'status': await setStatus(id, v); break;
    case 'mover': await move(id, Number(v)); break;
    case 'rota-todos': { const sep = S.vendas.filter(x => x.status === 'separado' || x.status === 'recebido').sort((p, q) => p.ts - q.ts); let o = nextOrdem(); await safe(async () => { for (const x of sep) await patch('vendas', x.id, { status: 'em_rota', ordemRota: o++ }); }, 'Pedidos colocados na rota.'); break; }
    case 'cx-det': if ($modal.innerHTML) closeModal(); modalLanc(t.dataset.col, id, t.dataset.eid); break;
    case 'estornar': if ($modal.innerHTML) closeModal(); modalEstorno(t.dataset.col, id); break;
    case 'escolher-estorno': { ui.sheet = null; render(); if (!canWrite) { toast('Modo leitura: não dá para estornar.'); break; } ui.vt = 'todas'; ui.vf = 'todas'; ui.vp = '30d'; go('vendas'); toast('Toque em Estornar na venda que quer devolver.'); break; }
    case 'cx-ver': ui.sheet = null; ui.cxv = v; render(); window.scrollTo(0, 0); break;
    case 'cx-limpar': ui.ct = 'tudo'; ui.cfp = 'todas'; render(); break;
    case 'cancelar': { const vd = S.vendas.find(x => x.id === id); if (vd && vd.pago) { if ($modal.innerHTML) closeModal(); modalEstorno('vendas', id, { cancelar: true }); break; } const volta = (vd?.itens || []).map(i => ({ produtoId: i.produtoId, qtd: n2(i.qtd - estQtd(vd, i.produtoId, true)) })).filter(i => i.qtd > 0); modalConfirm(`Cancelar a venda de <b>${esc(vd?.cliente?.nome || 'cliente avulso')}</b>? Os itens voltam para o estoque.`, 'Cancelar venda', () => safe(async () => { await patch('vendas', id, { status: 'cancelado', pago: false, pagoTs: null }); await adjustStock(volta, 1); }, 'Venda cancelada.')); break; }
    case 'apagar': { const r0 = S[t.dataset.col]?.find(x => x.id === id); if (r0 && estornos(r0).length) { toast('Este lançamento tem estorno e fica no histórico. Não dá para apagar.'); break; } } modalConfirm('Apagar este registro? Isso não pode ser desfeito.', 'Apagar', () => safe(() => del(t.dataset.col, id), 'Apagado.')); break;
    case 'apagar-compra': { const c = S.compras.find(x => x.id === id); if (c && estornos(c).length) { toast('Esta compra tem estorno e fica no histórico. Não dá para apagar.'); break; } modalConfirm('Apagar esta compra? Os itens saem do estoque e o valor sai do caixa.', 'Apagar compra', () => safe(async () => { await del('compras', id); await adjustStock(c.itens || [], -1); }, 'Compra apagada.')); break; }
    case 'compra-paga': await safe(() => patch('compras', id, { pago: true, pagoTs: Date.now() }), 'Compra marcada como paga.'); break;
    case 'apagar-produto': modalConfirm('Apagar este produto? As vendas antigas continuam nos relatórios.', 'Apagar produto', () => safe(() => del('produtos', id), 'Produto apagado.')); break;
    case 'noticia-ativa': await safe(() => patch('noticias', id, { ativa: v === '1' }), v === '1' ? 'Notícia aparecendo no app.' : 'Notícia tirada do app.'); break;
    case 'cli-hist': ui.hist = ui.hist === id ? null : id; render(); break;
    case 'track': ui.track = id; go('entregas'); break;
    case 'cart': { const p = prodById(id); const q = Math.max(0, Math.min((ui.cart[id] || 0) + Number(v), p?.estoque || 0)); if (q) ui.cart[id] = q; else delete ui.cart[id]; render(); break; }
    case 'banner': ui.banner = Number(v); render(); break;
    case 'news-cta': newsCTA(id); break;
    case 'noticia-fixa': await safe(() => patch('noticias', id, { fixa: v === '1' }), v === '1' ? 'Notícia fixada no topo.' : 'Notícia desafixada.'); break;
    case 'dup-noticia': { const o = S.noticias.find(x => x.id === id); if (o) modalNoticia(null, { ...o, ativa: true, inicio: '', fim: '', chatPendente: false }); break; }
    case 'nova-noticia-modelo': { if (!canWrite) { toast('Modo leitura: não dá para lançar.'); break; } const m = NEWS_MODELOS.find(x => x.k === v); modalNoticia(null, m ? newsDoModelo(m) : null); break; }
    case 'paguei': await safe(() => patch('vendas', id, { clienteInformouPix: true }), 'Avisamos o fornecedor. Ele confirma o recebimento.'); break;
    case 'copiar': { const el = document.getElementById(v); try { await navigator.clipboard.writeText(el.textContent); toast('Código copiado.'); } catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Código selecionado. Copie com o menu do celular.'); } break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chg === 'vdata') { ui[t.name] = t.value; if (ui.vDe && ui.vAte && ui.vDe > ui.vAte) [ui.vDe, ui.vAte] = [ui.vAte, ui.vDe]; render(); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'chat-txt' && ui.emo) { ui.emo = false; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.id === 'chat-txt') { e.preventDefault(); e.target.form?.requestSubmit(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($modal.innerHTML) closeModal(); else if (ui.sheet) { ui.sheet = null; render(); } } });

/* banner automático */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  if (ui.mode !== 'cliente' || ui.c !== 'inicio' || ui.sheet || $modal.innerHTML || document.hidden) return;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest('form')) return;
  const n = newsCliente().length; if (n > 1) { ui.banner = (ui.banner + 1) % n; render(); }
}, 6000);


/* ---------------- navegação: histórico, botão voltar do Android e gesto de deslizar ---------------- */
// Cada tela vira uma entrada no histórico do navegador (pushState). O botão voltar do Android
// (e o do navegador) volta para a tela anterior de verdade; só sai do app quando não há mais
// tela para trás. Deslizar o dedo para a esquerda volta; para a direita avança.
const navSnap = () => ({ m: ui.mode, g: ui.g, c: ui.c, conv: ui.g === 'conversas' ? (ui.conv || null) : null });
const navKey = s => s.m === 'gestao' ? 'g:' + s.g + (s.g === 'conversas' && s.conv ? ':' + s.conv : '') : 'c:' + s.c;
const NAV = { stack: [], pos: -1, max: -1, hist: true, applying: false };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function navAnim(back) {
  if (reduceMotion()) return;
  $main.classList.remove('nav-in', 'nav-inb'); void $main.offsetWidth;
  $main.classList.add(back ? 'nav-inb' : 'nav-in');
}
$main.addEventListener('animationend', () => $main.classList.remove('nav-in', 'nav-inb'));
function navSync() {
  if (NAV.applying) return;
  const s = navSnap();
  if (NAV.pos < 0) {
    NAV.stack = [s]; NAV.pos = NAV.max = 0;
    try { history.replaceState({ mmrNav: 0, s }, ''); } catch { NAV.hist = false; }
    return;
  }
  if (navKey(NAV.stack[NAV.pos]) === navKey(s)) { NAV.stack[NAV.pos] = { ...s, y: NAV.stack[NAV.pos].y }; return; }
  NAV.stack.length = NAV.pos + 1; NAV.stack.push(s); NAV.pos++; NAV.max = NAV.pos;
  if (NAV.hist) { try { history.pushState({ mmrNav: NAV.pos, s }, ''); } catch { NAV.hist = false; } }
  navAnim(false);
}
function navApply(s, back) {
  NAV.applying = true;
  ui.mode = 'gestao'; ui.g = s.g; ui.c = s.c; ui.conv = s.conv || null;
  ui.sheet = null; $modal.innerHTML = '';
  try { render(); } finally { NAV.applying = false; }
  const y = s.y || 0;
  window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y));
  navAnim(back);
}
function closeOverlays() { const had = popOpen(); ui.sheet = null; $modal.innerHTML = ''; if (had) render(); return had; }
const canBack = () => NAV.pos > 0;
const canFwd = () => NAV.pos < NAV.max;
function navBack() {
  if (closeOverlays()) return;
  if (!canBack()) return;
  if (NAV.hist) { history.back(); return; }
  NAV.pos--; navApply(NAV.stack[NAV.pos], true);
}
function navFwd() {
  if (!canFwd()) return;
  if (NAV.hist) { history.forward(); return; }
  NAV.pos++; navApply(NAV.stack[NAV.pos], false);
}
addEventListener('scroll', () => { if (NAV.pos >= 0 && NAV.stack[NAV.pos]) NAV.stack[NAV.pos].y = window.scrollY; }, { passive: true });
addEventListener('popstate', e => {
  const st = e.state;
  if (!st || !st.s) return;
  const back = st.mmrNav < NAV.pos;
  // Botão voltar com uma janela aberta: fecha a janela e continua na mesma tela.
  if (popOpen()) {
    closeOverlays();
    if (back) { try { history.forward(); NAV.skipNext = true; } catch {} }
    return;
  }
  if (NAV.skipNext) { NAV.skipNext = false; return; }
  const old = NAV.stack[st.mmrNav];
  NAV.pos = st.mmrNav; if (NAV.pos > NAV.max) NAV.max = NAV.pos;
  NAV.stack[NAV.pos] = { ...st.s, y: old && navKey(old) === navKey(st.s) ? old.y : 0 };
  navApply(NAV.stack[NAV.pos], back);
});

/* gesto de deslizar: dedo para a esquerda = voltar, para a direita = avançar */
const $ind = document.createElement('div'); $ind.className = 'swipe-ind'; $ind.setAttribute('aria-hidden', 'true'); document.body.appendChild($ind);
const SW = { on: false, x: 0, y: 0, t: 0, lock: null, dx: 0 };
const SW_MIN = 80;
function swipeBlocked(el) {
  if (popOpen()) return true;
  for (let n = el; n && n.nodeType === 1 && n !== document.body; n = n.parentElement) {
    if (n.matches('input,textarea,select,[contenteditable="true"],.lt-composer,.no-swipe')) return true;
    const ox = getComputedStyle(n).overflowX;
    if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth > n.clientWidth + 2) return true; // cartões que já arrastam para o lado ("Agora", notícias, filtros)
  }
  return false;
}
function swipeInd(dx) {
  const back = dx < 0, allowed = back ? canBack() : canFwd();
  if (!allowed || SW.lock !== 'h') { $ind.style.opacity = '0'; return; }
  const d = Math.min(Math.abs(dx), 140), ready = Math.abs(dx) >= SW_MIN;
  $ind.className = 'swipe-ind ' + (back ? 'r' : 'l') + (ready ? ' ok' : '');
  $ind.innerHTML = ic(back ? 'left' : 'right');
  $ind.style.transform = `translateX(${(back ? -1 : 1) * Math.min(d * .6, 70)}px)`;
  $ind.style.opacity = String(Math.min(1, d / SW_MIN));
}
function swipeEnd() { SW.on = false; SW.lock = null; $ind.style.opacity = '0'; $ind.style.transform = ''; }
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || swipeBlocked(e.target)) { SW.on = false; return; }
  const p = e.touches[0]; Object.assign(SW, { on: true, x: p.clientX, y: p.clientY, t: Date.now(), lock: null, dx: 0 });
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!SW.on) return;
  const p = e.touches[0], dx = p.clientX - SW.x, dy = p.clientY - SW.y;
  if (!SW.lock && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) SW.lock = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'h' : 'v';
  if (SW.lock === 'v') { SW.on = false; return; }
  SW.dx = dx; swipeInd(dx);
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!SW.on) return swipeEnd();
  const dx = SW.dx, fast = Math.abs(dx) > 45 && Math.abs(dx) / Math.max(1, Date.now() - SW.t) > 0.5, h = SW.lock === 'h';
  swipeEnd();
  if (!h || (Math.abs(dx) < SW_MIN && !fast)) return;
  if (dx < 0) { if (canBack()) navBack(); } else if (canFwd()) navFwd();
}, { passive: true });
document.addEventListener('touchcancel', swipeEnd, { passive: true });

applyTheme();
render();
boot();
})();
</script>
